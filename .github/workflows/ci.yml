name: CI — Aula Docente

on:
  push:
    branches: [main]
  pull_request:

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  calidad:
    name: Lint · TypeScript · Migraciones · Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app_db

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Aplicar migraciones versionadas (Drizzle)
        run: npx drizzle-kit migrate

      - name: Lint (ESLint)
        run: npm run lint

      - name: Verificación estricta de TypeScript
        run: npm run typecheck

      - name: Compilación de producción (Next.js)
        run: npm run build
