<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f1117">
<title>Química UNESUR — Plataforma de Química General</title>
<meta name="description" content="Plataforma educativa de Química General universitaria: simulaciones interactivas, contenido teórico completo, guías de laboratorio y videos explicativos.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚗️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f8f9fb;--card:#fff;--border:#e5e7ec;--text:#475569;--text2:#94a3b8;--white:#0f172a;--teal:#0d9488;--teal-d:#0f766e;--cyan:#06b6d4;--blue:#3b82f6;--indigo:#6366f1;--purple:#8b5cf6;--rose:#e11d48;--amber:#d97706;--emerald:#059669;--orange:#ea580c;--pink:#db2777;--r:14px;--r2:10px;--r3:8px;--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);--slate-50:#f8fafc;--slate-100:#f1f5f9;--slate-200:#e2e8f0;--slate-300:#cbd5e1;--slate-400:#94a3b8;--slate-500:#64748b;--slate-600:#475569;--slate-700:#334155;--slate-800:#1e293b;--slate-900:#0f172a;--radius:14px;--radius-sm:10px;--radius-xs:8px;--shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);--shadow-lg:0 4px 12px rgba(0,0,0,.07);--shadow-xl:0 10px 30px rgba(0,0,0,.1)}
html{scroll-behavior:smooth;font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;line-height:1.6;color:var(--text);background:var(--bg);color-scheme:light;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
body{min-height:100vh;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
img{max-width:100%;height:auto;display:block}
button,input,select,textarea{font:inherit;border:none;outline:none;background:none;-webkit-appearance:none}
ul,ol{list-style:none}
.container{width:100%;max-width:1100px;margin:0 auto;padding:0 20px}
@media(min-width:768px){.container{padding:0 32px}}

.navbar{position:sticky;top:0;z-index:100;background:linear-gradient(135deg,var(--slate-900),#134e4a);color:#fff;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-bottom:none;padding-top:var(--safe-top)}
.navbar.scrolled{box-shadow:0 4px 20px rgba(0,0,0,.2)}
.navbar-inner{display:flex;align-items:center;justify-content:space-between;height:56px}
@media(min-width:768px){.navbar-inner{height:60px}}
.logo{display:flex;align-items:center;gap:10px}
.logo-icon{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--teal),var(--cyan));display:flex;align-items:center;justify-content:center;color:#fff;font-size:.9rem;font-weight:700;box-shadow:0 3px 10px rgba(13,148,136,.2)}
.logo-text{font-weight:800;font-size:1.1rem;color:#fff;-webkit-text-fill-color:#fff}
.nav-links{display:none;gap:2px}
.nav-links a{padding:7px 13px;border-radius:var(--r3);font-size:.8rem;font-weight:500;color:rgba(255,255,255,.55);transition:color .2s}
.nav-links a:hover{color:#fff}
.nav-cta{display:none;padding:8px 18px;border-radius:var(--r3);font-weight:600;font-size:.8rem;color:var(--slate-900);background:#fff;cursor:pointer;transition:all .2s}
.nav-cta:hover{background:rgba(255,255,255,.85)}
.mobile-toggle{display:flex;padding:8px;border-radius:var(--r3);cursor:pointer;color:rgba(255,255,255,.7);font-size:1.4rem;line-height:1;min-width:40px;min-height:40px;align-items:center;justify-content:center}
.mobile-menu{display:none;padding:8px 20px 16px;background:var(--slate-900);border-top:1px solid rgba(255,255,255,.08)}
.mobile-menu.open{display:block}
.mobile-menu a{display:flex;align-items:center;gap:10px;padding:12px 0;color:rgba(255,255,255,.55);font-weight:500;font-size:.9rem;border-bottom:1px solid rgba(255,255,255,.06)}
.mobile-menu a:last-child{border:none}
.mobile-menu a:active{color:#fff}
@media(min-width:768px){.nav-links{display:flex}.nav-cta{display:inline-flex}.mobile-toggle{display:none}}

.hero{position:relative;padding:60px 0 80px;overflow:hidden;background:linear-gradient(135deg,var(--slate-900),#134e4a);color:#fff}
@media(min-width:768px){.hero{padding:100px 0 100px}}
.hero::before{content:'';position:absolute;top:-40%;right:-20%;width:60%;height:80%;background:radial-gradient(ellipse,rgba(20,184,166,.1),transparent 70%);pointer-events:none}
.hero::after{content:'';position:absolute;bottom:-30%;left:-15%;width:50%;height:60%;background:radial-gradient(ellipse,rgba(6,182,212,.08),transparent 70%);pointer-events:none}
.hero-grid{display:grid;gap:40px;align-items:center;position:relative;z-index:2}
@media(min-width:1024px){.hero-grid{grid-template-columns:1fr 1fr}}
.hero-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);padding:5px 14px;border-radius:999px;font-size:.72rem;font-weight:600;color:rgba(255,255,255,.9);margin-bottom:20px}
.hero-badge .pulse{width:7px;height:7px;background:var(--teal);border-radius:50%;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(1.6)}}
.hero h1{font-size:clamp(1.8rem,4.5vw,3rem);font-weight:900;line-height:1.1;margin-bottom:16px;color:#fff;letter-spacing:-.03em}
.hero h1 .grad{background:linear-gradient(90deg,#5eead4,#67e8f9);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero-desc{font-size:.95rem;color:rgba(255,255,255,.55);max-width:480px;margin-bottom:28px;line-height:1.7}
.hero-actions{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;gap:7px;padding:11px 22px;border-radius:var(--r3);font-weight:600;font-size:.84rem;cursor:pointer;transition:all .2s;border:none;min-height:44px}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,var(--teal),var(--cyan));color:#fff;box-shadow:0 4px 16px rgba(13,148,136,.2)}
.btn-primary:hover{box-shadow:0 6px 24px rgba(13,148,136,.25);transform:translateY(-1px)}
.btn-ghost{background:rgba(255,255,255,.04);color:var(--text);border:1px solid var(--border)}
.btn-ghost:hover{border-color:rgba(255,255,255,.12);color:var(--white)}
.hero-stats{display:flex;flex-wrap:wrap;gap:16px;margin-top:28px;padding-top:24px;border-top:1px solid rgba(255,255,255,.1)}
.hero-stats .stat{display:flex;align-items:center;gap:6px;font-size:.8rem;font-weight:600;color:rgba(255,255,255,.6)}
.hero-cards{display:none}
@media(min-width:1024px){.hero-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}}
.hero-card{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);padding:16px;border-radius:var(--r);transition:border-color .25s}
.hero-card:hover{border-color:rgba(255,255,255,.25)}
.hero-card .hc-icon{font-size:1.4rem;margin-bottom:6px}
.hero-card .hc-title{font-size:.82rem;font-weight:700;color:#fff;margin-bottom:2px}
.hero-card .hc-desc{font-size:.7rem;color:rgba(255,255,255,.5)}
.hero-bar{margin-top:32px;padding-top:24px;border-top:1px solid rgba(255,255,255,.1)}
.hero-bar-inner{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px}
.hero-bar-stats{display:flex;gap:20px;flex-wrap:wrap}
.hb-stat{display:flex;flex-direction:column;align-items:center;gap:2px}
.hb-num{font-size:1.1rem;font-weight:800;color:#fff}
.hb-label{font-size:.6rem;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.06em}
.hero-bar-credit{text-align:right;font-size:.72rem;color:rgba(255,255,255,.45);line-height:1.5}
.hero-bar-credit strong{display:block;color:rgba(255,255,255,.8);font-size:.82rem}
.hero-wave{position:absolute;bottom:0;left:0;right:0;z-index:3}
.hero-wave svg{display:block;width:100%;height:40px}
@media(min-width:768px){.hero-wave svg{height:60px}}

section{padding:48px 0}
@media(min-width:768px){section{padding:64px 0}}
.section-tag{display:inline-flex;font-size:.65rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;padding:4px 10px;border-radius:999px;margin-bottom:10px;color:var(--teal);background:rgba(13,148,136,.06);border:1px solid rgba(13,148,136,.12)}
.section-title::after{content:'';display:block;width:40px;height:3px;background:linear-gradient(90deg,var(--teal),var(--cyan));border-radius:2px;margin-top:8px}
.section-title{font-size:clamp(1.3rem,3vw,1.9rem);font-weight:800;color:var(--white);margin-bottom:6px;letter-spacing:-.02em}
.section-desc{font-size:.88rem;color:var(--text2);max-width:500px;line-height:1.7}
.section-header{margin-bottom:32px}

.grid-3{display:grid;gap:12px}
@media(min-width:640px){.grid-3{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1024px){.grid-3{grid-template-columns:repeat(3,1fr)}}
.grid-4{display:grid;gap:12px;grid-template-columns:repeat(2,1fr)}
@media(min-width:1024px){.grid-4{grid-template-columns:repeat(4,1fr)}}

.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:all .25s;border-left:3px solid transparent}
.card:hover{border-color:rgba(13,148,136,.15);border-left-color:var(--teal);transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.card:active{transform:scale(.98)}
.card-bar{height:3px;opacity:.6}
.card-body{padding:16px}
@media(min-width:768px){.card-body{padding:18px}}
.card-icon{font-size:1.5rem;margin-bottom:8px}
.card-title{font-size:.88rem;font-weight:700;color:var(--white);margin-bottom:4px;line-height:1.3}
.card-desc{font-size:.76rem;color:var(--text2);line-height:1.5;margin-bottom:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-meta{display:flex;justify-content:space-between;font-size:.68rem}
.card-meta .meta-left{color:var(--text2)}
.card-meta .meta-right{color:var(--teal);font-weight:600}
.card-tag{font-size:.58rem;font-weight:600;text-transform:uppercase;letter-spacing:.04em;padding:3px 8px;border-radius:6px;display:inline-block;margin-bottom:8px}
.card-foot{padding:10px 16px;border-top:1px solid var(--border);font-size:.76rem;font-weight:600;color:var(--teal);display:flex;justify-content:space-between;align-items:center;min-height:40px;background:linear-gradient(90deg,rgba(13,148,136,.03),transparent)}

.modal-overlay{display:none;position:fixed;inset:0;z-index:200;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.modal-overlay.open{display:block}
.modal{background:var(--bg);width:100%;min-height:100vh;overflow-y:auto;animation:mu .2s ease-out;border:none;max-width:100%}
@keyframes mu{from{opacity:0}to{opacity:1}}
.modal-header{padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--border);max-width:800px;margin:0 auto;width:100%}
.modal-header.colored{border-bottom:none}
.modal-header h2{font-size:.95rem;font-weight:700;color:var(--white);margin:0;flex:1;padding-right:10px}
.modal-header.colored h2{color:#fff}
.modal-close{width:32px;height:32px;border-radius:var(--r3);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1rem;background:var(--bg);color:var(--text2);border:1px solid var(--border);flex-shrink:0;transition:all .15s}
.modal-close:hover{background:var(--border);color:var(--white)}
.modal-header.colored .modal-close{background:rgba(255,255,255,.12);color:#fff;border:none}
.modal-body{padding:20px}

.lesson-header{padding:20px;color:#fff;position:relative}
.lesson-header h2{font-size:1.05rem;font-weight:700;margin-bottom:2px;padding-right:40px}
.lesson-header p{font-size:.76rem;opacity:.6}
.lesson-block-header{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.lesson-block-num{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,var(--teal),var(--cyan));color:#fff;box-shadow:0 2px 6px rgba(13,148,136,.2);display:flex;align-items:center;justify-content:center;font-size:.65rem;font-weight:700;flex-shrink:0}
.lesson-block-header h2{margin:0;font-size:.9rem;color:var(--white)}
.lesson-divider{height:1px;background:var(--border);margin-top:20px}
.lesson-content{padding:20px;font-size:.84rem;line-height:1.8;color:var(--text)}
.lesson-content strong{color:var(--white);font-weight:900}
.lesson-content h2{font-size:.95rem;font-weight:700;color:var(--white);margin:1.2rem 0 .4rem}
.lesson-content p{margin-bottom:.6rem;white-space:pre-line}
.lesson-content ul,.lesson-content ol{margin:.5rem 0 .8rem 1.2rem}
.lesson-content ul{list-style:disc}
.lesson-content ol{list-style:decimal}
.lesson-content li{margin-bottom:.25rem;color:var(--text2);font-size:.8rem}

.sim-grid{display:grid;gap:14px}
@media(min-width:768px){.sim-grid{grid-template-columns:260px 1fr}}
.sim-controls{background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:14px}
.sim-controls h4{font-size:.82rem;font-weight:700;margin-bottom:12px;color:var(--white)}
.control-group{margin-bottom:14px}
.control-group label{display:flex;justify-content:space-between;font-size:.74rem;color:var(--text2);margin-bottom:6px}
.control-group label span{color:var(--teal);font-weight:600}
input[type=range]{width:100%;height:5px;border-radius:999px;background:var(--border);-webkit-appearance:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--teal);border:3px solid var(--bg);box-shadow:0 1px 4px rgba(0,0,0,.3)}
.result-box{padding:10px;border-radius:var(--r3);text-align:center;background:var(--bg);border:1px solid var(--border)}
.result-box .rb-label{font-size:.55rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text2);margin-bottom:2px}
.result-box .rb-value{font-size:.95rem;font-weight:800}
.results-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.sim-info{margin-top:10px;background:var(--bg);border:1px solid var(--border);border-radius:var(--r3);padding:10px;display:flex;gap:6px;align-items:flex-start}
.sim-info p{font-size:.72rem;color:var(--text2);line-height:1.5}
.sim-info strong{color:var(--white)}
.big-result{padding:14px;border-radius:var(--r);text-align:center;color:#fff;margin-top:14px}
.big-result .br-label{font-size:.55rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;opacity:.7;margin-bottom:2px}
.big-result .br-value{font-size:1.6rem;font-weight:800}

.ph-display{background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:18px;text-align:center;margin-bottom:12px}
.ph-num{font-size:2.8rem;font-weight:900;line-height:1}
.ph-label{font-size:.72rem;color:var(--text2);margin-top:3px}
.ph-bar{height:8px;border-radius:999px;background:linear-gradient(90deg,#ef4444,#f59e0b,#eab308,#22c55e,#06b6d4,#3b82f6,#6366f1);position:relative;margin-top:12px}
.ph-marker{position:absolute;top:-2px;width:3px;height:12px;background:var(--white);border-radius:2px;box-shadow:0 0 6px rgba(0,0,0,.4);transition:left .3s}
.ph-labels{display:flex;justify-content:space-between;font-size:.6rem;color:var(--text2);margin-top:3px}
.curve-box{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:12px}
.curve-box h4{font-size:.8rem;font-weight:700;margin-bottom:8px;color:var(--white)}

.pt-grid{display:grid;grid-template-columns:repeat(18,1fr);gap:2px;min-width:700px}
@media(min-width:768px){.pt-grid{gap:3px;min-width:850px}}
.pt-cell{aspect-ratio:1;border-radius:5px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;border:1px solid transparent}
.pt-cell:hover{transform:scale(1.12);z-index:5;border-color:var(--teal);box-shadow:0 0 12px rgba(45,212,191,.15)}
.pt-cell .pt-num{font-size:6px;font-weight:600;color:var(--text2)}
@media(min-width:768px){.pt-cell .pt-num{font-size:7px}}
.pt-cell .pt-sym{font-size:10px;font-weight:800;color:var(--white);margin-top:1px}
@media(min-width:768px){.pt-cell .pt-sym{font-size:12px}}
.pt-empty{cursor:default}.pt-empty:hover{transform:none;box-shadow:none;border-color:transparent}
.pt-alkali{background:rgba(251,113,133,.12)}.pt-alkaline{background:rgba(251,191,36,.1)}.pt-transition{background:rgba(96,165,250,.1)}.pt-post-trans{background:rgba(52,211,153,.08)}.pt-metalloid{background:rgba(167,139,250,.1)}.pt-nonmetal{background:rgba(45,212,191,.1)}.pt-halogen{background:rgba(244,114,182,.1)}.pt-noble{background:rgba(34,211,238,.1)}
.pt-legend{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:16px}
.pt-legend-item{display:flex;align-items:center;gap:4px;font-size:.62rem;font-weight:500;color:var(--text2)}
.pt-legend-color{width:9px;height:9px;border-radius:3px}
.el-detail{margin-top:18px;background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px;display:none;animation:mu .2s}
.el-detail.visible{display:flex;gap:14px;align-items:center;position:relative}
.el-big{width:56px;height:56px;border-radius:var(--r2);display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0}
.eb-num{font-size:9px;font-weight:600;opacity:.6}
.eb-sym{font-size:22px;font-weight:800}
.el-info h3{font-size:.95rem;font-weight:700;color:var(--white);margin-bottom:3px}
.el-props{display:flex;gap:10px;flex-wrap:wrap}
.el-prop{font-size:.72rem;color:var(--text2)}
.el-prop strong{color:var(--text);margin-left:3px}
.el-config{margin-top:5px;font-family:monospace;font-size:.68rem;background:var(--bg);padding:3px 6px;border-radius:4px;color:var(--text2)}

.video-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:all .25s}
.video-card:hover{border-color:rgba(59,130,246,.2);transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.video-thumb{position:relative;aspect-ratio:16/9;background:var(--bg)}
.video-thumb img{width:100%;height:100%;object-fit:cover;opacity:.85}
.video-play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.2)}
@media(min-width:768px){.video-play{opacity:0;transition:opacity .2s}.video-card:hover .video-play{opacity:1}}
.video-play-btn{width:40px;height:40px;background:var(--teal);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--bg);font-size:1rem;padding-left:3px;box-shadow:0 0 20px rgba(45,212,191,.3)}
.video-dur{position:absolute;bottom:6px;right:6px;background:rgba(0,0,0,.7);color:#fff;font-size:.6rem;font-weight:600;padding:2px 5px;border-radius:4px}
.video-info{padding:12px}
.vi-tag{font-size:.58rem;font-weight:600;text-transform:uppercase;color:var(--blue);letter-spacing:.04em}
.video-info h3{font-size:.82rem;font-weight:700;margin:3px 0 3px;line-height:1.3;color:var(--white);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.video-info p{font-size:.7rem;color:var(--text2);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vm-iframe{aspect-ratio:16/9;background:#000;border-radius:var(--r3);overflow:hidden}
.vm-iframe iframe{width:100%;height:100%;border:none}

.faq-list{border-radius:var(--r)}
.faq-list h3{font-size:1rem;font-weight:700;color:var(--white);margin-bottom:12px}
.faq-item{margin-bottom:6px;background:var(--card);border:1px solid var(--border);border-radius:var(--r2);overflow:hidden}
.faq-q{width:100%;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;text-align:left;font-size:.84rem;font-weight:600;color:var(--text);cursor:pointer;min-height:44px}
.faq-chevron{font-size:.55rem;color:var(--text2);transition:transform .2s;flex-shrink:0;margin-left:10px}
.faq-item.open .faq-chevron{transform:rotate(180deg)}
.faq-item.open .faq-q{color:var(--teal);border-left:3px solid var(--teal);padding-left:11px}
.faq-a{max-height:0;overflow:hidden;transition:max-height .25s}

ottom:40px"><div style="display:grid;gap:32px"><div id="faq-list" class="faq-list"></div><div id="contact-form-container"></div></div></section></main><footer><div class="container"><div class="footer-grid"><div><div class="logo" style="margin-bottom:4px"><div class="logo-icon">H₂O</div><span class="logo-text">${C.site.name}</span></div><p class="footer-desc">${C.footer.description}</p></div>${C.footer.columns.map(col=>`<div><h4 class="footer-h">${col.title}</h4><ul class="footer-links">${col.links.map(l=>`<li><a href="#">${l}</a></li>`).join('')}</ul></div>`).join('')}</div><div class="footer-bottom"><p class="copy">© ${C.site.year} ${C.site.name}</p><div class="socials">${C.footer.socials.map(s=>`<a href="${s.url}" class="social-link">${s.label}</a>`).join('')}</div></div></div></footer>`;renderTopics();renderSimulations();renderLabs();renderVideos();renderPeriodicTable();renderFAQs();renderContactForm()}
function bS(k,gc,gi,cc){const s=C.sections[k];if(!s)return'';const inner=cc||`<div class="${gc}" id="${gi}"></div>`;return`<section id="${k}"><div class="container"><div class="section-header"><span class="section-tag" style="background:${s.tagColor};color:${s.tagText}">${s.tag}</span><h2 class="section-title">${s.title}</h2><p class="section-desc">${s.desc}</p></div>${inner}</div></section>`}

function openModal(id){document.getElementById(id).classList.add('open');document.body.style.overflow='hidden';document.body.style.position='fixed';document.body.style.width='100%';document.body.style.top=`-${window.scrollY}px`;document.body.dataset.scrollY=window.scrollY}

function openTopic(id){const t=C.topics.find(x=>x.id===id);document.getElementById('topic-modal-content').innerHTML=`<div class="modal-header"><h2>${t.icon} ${t.title}</h2><button class="modal-close" onclick="closeModal('topic-modal')">✕</button></div><div class="modal-body"><div style="background:var(--bg);padding:14px;border-radius:var(--r2);margin-bottom:16px;border-left:3px solid ${t.color}"><p style="font-size:.85rem;color:var(--text)">${t.desc}</p></div><h4 style="font-size:.8rem;font-weight:600;margin-bottom:10px;color:var(--text2);text-transform:uppercase;letter-spacing:.05em">Lecciones</h4><div style="display:grid;gap:6px">${t.lessons.map((l,i)=>`<div class="lesson-link" data-lesson="${i}" data-topic="${id}" style="display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--bg);border:1px solid var(--border);border-radius:var(--r3);cursor:pointer;min-height:48px;transition:border-color .15s"><span style="font-weight:600;font-size:.85rem;color:var(--white)">${l}</span><span style="color:${t.color};font-size:1.1rem">▶</span></div>`).join('')}</div></div>`;document.querySelectorAll('.lesson-link').forEach(el=>{el.addEventListener('click',function(){const ti=C.topics.find(x=>x.id===this.dataset.topic);openLesson(ti.lessons[+this.dataset.lesson],ti.title,ti.color)})});openModal('topic-modal')}
let quizState={};function openLesson(title,topic,color){const sections=C.lessonContent[title]||C.lessonContent['_default'];const quiz=C.quizzes[title]||C.quizzes['_default'];quizState={title,answered:{},score:0};document.getElementById('lesson-modal-content').innerHTML=`<div class="lesson-header" style="background:${color}"><button class="modal-close" onclick="closeModal('lesson-modal')" style="position:absolute;top:16px;right:16px">✕</button><p>${topic}</p><h2>${title}</h2><div style="margin-top:8px;font-size:.7rem;opacity:.6">${sections.length} secciones + Quiz</div></div><div class="modal-body lesson-content">${sections.map((s,i)=>`<div style="margin-bottom:${i<sections.length-1?'24px':'0'}"><div class="lesson-block-header"><span class="lesson-block-num">${i+1}</span><h2 style="margin:0">${s.t}</h2></div><p>${md(s.c)}</p>${i<sections.length-1?'<div class="lesson-divider"></div>':''}</div>`).join('')}<div class="quiz-section"><div class="quiz-title"><span>📝</span> Autoevaluación</div>${quiz.map((q,qi)=>`<div class="quiz-question" data-qi="${qi}"><div class="quiz-question-text">${qi+1}. ${q.q}</div><div class="quiz-options">${q.opts.map((o,oi)=>`<div class="quiz-option" data-qi="${qi}" data-oi="${oi}" onclick="pickQuiz(this,${qi},${oi})" role="button" tabindex="0"><span class="opt-marker">${String.fromCharCode(65+oi)}</span><span>${o}</span></div>`).join('')}</div><div class="quiz-feedback" id="qf-${qi}"></div></div>`).join('')}<div class="quiz-score" id="quiz-score" style="display:none"><div style="font-size:.7rem;text-transform:uppercase;opacity:.7">Tu puntuación</div><div class="quiz-score-value" id="qsv"></div><div class="quiz-score-text" id="qst"></div></div></div><button class="btn btn-primary" onclick="closeModal('lesson-modal')" style="width:100%;justify-content:center;margin-top:20px">✅ Lección completada</button></div>`;openModal('lesson-modal')}
function pickQuiz(el,qi,oi){const quiz=C.quizzes[quizState.title]||C.quizzes['_default'];const q=quiz[qi];if(quizState.answered[qi]!==undefined)return;quizState.answered[qi]=oi;document.querySelectorAll(`.quiz-option[data-qi="${qi}"]`).forEach((o,i)=>{o.style.pointerEvents='none';if(i===q.correct)o.classList.add('correct');else if(i===oi)o.classList.add('incorrect')});const fb=document.getElementById(`qf-${qi}`);if(oi===q.correct){quizState.score++;fb.className='quiz-feedback show correct';fb.innerHTML='<strong>✓ ¡Correcto!</strong> '+q.exp}else{fb.className='quiz-feedback show incorrect';fb.innerHTML='<strong>✗ Incorrecto.</strong> '+q.exp}if(Object.keys(quizState.answered).length===quiz.length){const s=quizState.score,pct=Math.round(s/quiz.length*100);document.getElementById('quiz-score').style.display='block';document.getElementById('qsv').textContent=s+'/'+quiz.length;document.getElementById('qst').textContent=pct===100?'¡Excelente! Dominas este tema.':pct>=70?'¡Muy bien! Repasa los puntos que fallaste.':'Te recomendamos repasar la lección.';document.getElementById('quiz-score').scrollIntoView({behavior:'smooth',block:'center'})}}

const simEngines={};
simEngines['sim-ph']=function(c){let val=7,sub='Agua pura';const list=[{v:1,s:'Ácido batería'},{v:2.5,s:'Jugo limón'},{v:3,s:'Vinagre'},{v:5.5,s:'Café'},{v:6.5,s:'Leche'},{v:7,s:'Agua destilada'},{v:7.4,s:'Sangre'},{v:8.5,s:'Bicarbonato'},{v:10.5,s:'Leche magnesia'},{v:12.5,s:'Blanqueador'}];function render(){let col='var(--teal)';if(val<6.5)col='#ef4444';if(val>7.5)col='var(--blue)';c.innerHTML=`<div class="sim-grid"><div class="sim-controls"><h4>⚙️ Sustancia</h4><div class="control-group"><label>pH: <span>${val}</span></label><input type="range" min="0" max="14" step="0.1" value="${val}" oninput="simPH.update(+this.value)"></div><div style="display:grid;gap:5px">${list.map(i=>`<button onclick="simPH.update(${i.v},'${i.s}')" style="padding:8px 10px;font-size:.75rem;border:1px solid var(--border);border-radius:var(--r3);text-align:left;cursor:pointer;min-height:38px;background:${sub===i.s?'var(--border)':'none'};color:var(--text);font-weight:${sub===i.s?'700':'400'}">${i.s} (${i.v})</button>`).join('')}</div></div><div><h4 style="font-weight:700;margin-bottom:10px;color:var(--white)">🧪 pH</h4><div class="ph-display"><div class="ph-num" style="color:${col}">${val.toFixed(1)}</div><div class="ph-label">${val<7?'ÁCIDO':val>7?'BÁSICO':'NEUTRO'} — ${sub}</div><div class="ph-bar"><div class="ph-marker" style="left:${(val/14)*100}%"></div></div><div class="ph-labels"><span>0</span><span>7</span><span>14</span></div></div><div class="sim-info"><div>ℹ️</div><p><strong>pH = -log[H⁺]</strong></p></div></div></div>`}window.simPH={update:(v,s)=>{val=v;sub=s||'Desconocida';render()}};render()};
simEngines['sim-tit']=function(c){let Ca=.1,Va=50,Cb=.1,Vb=0;function render(){const Veq=(Ca*Va)/Cb,pH=Vb<Veq?(Vb===0?-Math.log10(Ca):-Math.log10((Ca*Va-Cb*Vb)/(Va+Vb))):Vb===Veq?7:(14+Math.log10((Cb*Vb-Ca*Va)/(Va+Vb)));const pts=[];for(let i=0;i<=Veq*2;i+=.5){const p=i<Veq?(i===0?-Math.log10(Ca):-Math.log10((Ca*Va-Cb*i)/(Va+i))):i===Veq?7:(14+Math.log10((Cb*i-Ca*Va)/(Va+i)));pts.push({x:i,y:p})}const pathD="M"+pts.map(p=>`${40+(p.x/(Veq*2))*340},${10+(1-p.y/14)*210}`).join(" L");c.innerHTML=`<div class="sim-grid"><div class="sim-controls"><h4>🧪 Titulación</h4><div class="control-group"><label>C ácido: <span>${Ca.toFixed(3)} M</span></label><input type="range" min=".01" max="1" step=".01" value="${Ca}" onchange="simTit.Ca=+this.value;simTit.render()" oninput="this.parentNode.querySelector('span').textContent=(+this.value).toFixed(3)+' M'"></div><div class="control-group"><label>V ácido: <span>${Va} mL</span></label><input type="range" min="10" max="100" step="5" value="${Va}" onchange="simTit.Va=+this.value;simTit.render()" oninput="this.parentNode.querySelector('span').textContent=this.value+' mL'"></div><div class="control-group"><label>C base: <span>${Cb.toFixed(3)} M</span></label><input type="range" min=".01" max="1" step=".01" value="${Cb}" onchange="simTit.Cb=+this.value;simTit.render()" oninput="this.parentNode.querySelector('span').textContent=(+this.value).toFixed(3)+' M'"></div><hr style="border:none;border-top:1px solid var(--border);margin:8px 0"><div class="control-group"><label>V base: <span style="color:var(--purple)">${Vb.toFixed(1)} mL</span></label><input type="range" min="0" max="${Math.round(Veq*2)}" step=".5" value="${Vb}" onchange="simTit.Vb=+this.value;simTit.render()" oninput="this.parentNode.querySelector('span').textContent=(+this.value).toFixed(1)+' mL'"></div><div class="results-grid"><div class="result-box"><div class="rb-label">V equiv.</div><div class="rb-value" style="color:var(--purple)">${Veq.toFixed(1)} mL</div></div><div class="result-box"><div class="rb-label">pH</div><div class="rb-value" style="color:${pH<7?'#ef4444':'var(--blue)'}">${pH.toFixed(2)}</div></div></div></div><div><div class="curve-box"><h4>📈 Curva</h4><svg viewBox="0 0 400 240" style="width:100%"><rect x="40" y="10" width="340" height="210" fill="var(--bg)" stroke="var(--border)" rx="4"/>${[0,2,4,6,7,8,10,12,14].map(p=>`<line x1="40" y1="${10+(1-p/14)*210}" x2="380" y2="${10+(1-p/14)*210}" stroke="${p===7?'var(--teal)':'var(--border)'}" stroke-width="${p===7?1:.5}" ${p===7?'stroke-dasharray="4,4"':''}/><text x="36" y="${14+(1-p/14)*210}" text-anchor="end" style="font-size:8px;fill:var(--text2)">${p}</text>`).join('')}<path d="${pathD}" fill="none" stroke="var(--purple)" stroke-width="2"/><circle cx="${40+(Vb/(Veq*2))*340}" cy="${10+(1-pH/14)*210}" r="4" fill="#ef4444" stroke="var(--card)" stroke-width="2"/></svg></div><div class="sim-info"><div>ℹ️</div><p><strong>Ca×Va = Cb×Vb</strong></p></div></div></div>`}window.simTit={Ca,Va,Cb,Vb,render(){Ca=this.Ca;Va=this.Va;Cb=this.Cb;Vb=this.Vb;render()}};render()};
simEngines['sim-estequio']=function(c){let masa=10,mmR=18.02,mmP=44.01,cR=1,cP=1;function render(){const nR=masa/mmR,nP=nR*(cP/cR),mP=nP*mmP,part=nR*6.022e23;c.innerHTML=`<div class="sim-grid"><div class="sim-controls"><h4>⚙️ Reactivo</h4><div class="control-group"><label>Masa: <span>${masa.toFixed(1)} g</span></label><input type="range" min=".1" max="100" step=".1" value="${masa}" onchange="simEst.masa=+this.value;simEst.render()" oninput="this.parentNode.querySelector('span').textContent=(+this.value).toFixed(1)+' g'"></div><div class="control-group"><label>MM R: <span>${mmR.toFixed(2)}</span></label><input type="range" min="1" max="300" step=".01" value="${mmR}" onchange="simEst.mmR=+this.value;simEst.render()" oninput="this.parentNode.querySelector('span').textContent=(+this.value).toFixed(2)"></div><div class="control-group"><label>MM P: <span>${mmP.toFixed(2)}</span></label><input type="range" min="1" max="300" step=".01" value="${mmP}" onchange="simEst.mmP=+this.value;simEst.render()" oninput="this.parentNode.querySelector('span').textContent=(+this.value).toFixed(2)"></div></div><div><h4 style="font-weight:700;margin-bottom:10px;color:var(--white)">📊 Resultados</h4><div class="results-grid"><div class="result-box"><div class="rb-label">Moles R</div><div class="rb-value" style="color:var(--blue)">${nR.toFixed(4)}</div></div><div class="result-box"><div class="rb-label">Moles P</div><div class="rb-value" style="color:var(--teal)">${nP.toFixed(4)}</div></div><div class="result-box"><div class="rb-label">Masa P</div><div class="rb-value" style="color:var(--purple)">${mP.toFixed(2)} g</div></div><div class="result-box"><div class="rb-label">Partículas</div><div class="rb-value" style="color:var(--amber);font-size:.78rem">${part.toExponential(2)}</div></div></div><div class="sim-info" style="margin-top:10px"><div>ℹ️</div><p><strong>n=m/M | N=n×Nₐ</strong></p></div></div></div>`}window.simEst={masa,mmR,mmP,cR,cP,render(){masa=this.masa;mmR=this.mmR;mmP=this.mmP;cR=this.cR;cP=this.cP;render()}};render()};
simEngines['sim-dilucion']=function(c){let M1=12,M2=.5,V2=500;function render(){const V1=(M2*V2)/M1;c.innerHTML=`<div class="sim-grid"><div class="sim-controls"><h4>⚙️ Parámetros</h4><div class="control-group"><label>M₁: <span>${M1.toFixed(1)} M</span></label><input type="range" min=".1" max="18" step=".1" value="${M1}" onchange="simDil.M1=+this.value;simDil.render()" oninput="this.parentNode.querySelector('span').textContent=(+this.value).toFixed(1)+' M'"></div><div class="control-group"><label>M₂: <span>${M2.toFixed(2)} M</span></label><input type="range" min=".01" max="${M1}" step=".01" value="${M2}" onchange="simDil.M2=+this.value;simDil.render()" oninput="this.parentNode.querySelector('span').textContent=(+this.value).toFixed(2)+' M'"></div><div class="control-group"><label>V₂: <span>${V2} mL</span></label><input type="range" min="10" max="2000" step="10" value="${V2}" onchange="simDil.V2=+this.value;simDil.render()" oninput="this.parentNode.querySelector('span').textContent=this.value+' mL'"></div></div><div><div class="big-result" style="background:var(--teal)"><div class="br-label">V₁ necesario</div><div class="br-value">${V1.toFixed(2)} mL</div></div><div class="sim-info" style="margin-top:10px"><div>ℹ️</div><p><strong>M₁×V₁ = M₂×V₂</strong></p></div></div></div>`}window.simDil={M1,M2,V2,render(){M1=this.M1;M2=this.M2;V2=this.V2;render()}};render()};
simEngines['sim-config']=function(c){let z=11;function getConfig(Z){const order=['1s','2s','2p','3s','3p','4s','3d','4p','5s','4d','5p','6s','4f','5d','6p','7s','5f','6d','7p'];const maxE={s:2,p:6,d:10,f:14};let rem=Z;const res=[];for(const orb of order){if(rem<=0)break;const t=orb[orb.length-1],mx=maxE[t],e=Math.min(rem,mx);const sup='⁰¹²³⁴⁵⁶⁷⁸⁹';res.push(orb+String(e).split('').map(c=>sup[+c]).join(''));rem-=e}return res.join(' ')}function render(){c.innerHTML=`<div class="sim-grid"><div class="sim-controls"><h4>⚙️ Elemento</h4><div class="control-group"><label>Z: <span>${z}</span></label><input type="range" min="1" max="36" step="1" value="${z}" onchange="simCfg.z=+this.value;simCfg.render()" oninput="this.parentNode.querySelector('span').textContent=this.value"></div><div style="text-align:center;background:var(--bg);padding:14px;border-radius:var(--r2);border:1px solid var(--border);margin-top:6px"><div style="font-size:2.2rem;font-weight:900;color:var(--white)">${z}</div><div style="font-size:.7rem;color:var(--text2)">Z = número atómico</div></div></div><div><div style="background:rgba(249,115,22,.06);border:1px solid rgba(249,115,22,.12);padding:14px;border-radius:var(--r2);margin-bottom:10px"><h4 style="font-size:.78rem;font-weight:700;color:#f97316;margin-bottom:4px">Configuración</h4><p style="font-family:monospace;font-weight:700;color:#fb923c;font-size:.9rem;word-break:break-all">${getConfig(z)}</p></div><div class="sim-info"><div>ℹ️</div><p><strong>Aufbau + Pauli + Hund</strong></p></div></div></div>`}window.simCfg={z,render(){z=this.z;render()}};render()};
simEngines['sim-nox']=function(c){const compounds=[{f:'H₂O',els:[{s:'H',n:1,c:2},{s:'O',n:-2,c:1}]},{f:'H₂SO₄',els:[{s:'H',n:1,c:2},{s:'S',n:6,c:1},{s:'O',n:-2,c:4}]},{f:'NaCl',els:[{s:'Na',n:1,c:1},{s:'Cl',n:-1,c:1}]},{f:'KMnO₄',els:[{s:'K',n:1,c:1},{s:'Mn',n:7,c:1},{s:'O',n:-2,c:4}]},{f:'Fe₂O₃',els:[{s:'Fe',n:3,c:2},{s:'O',n:-2,c:3}]}];let idx=0;function render(){const cp=compounds[idx],sum=cp.els.reduce((a,e)=>a+e.n*e.c,0);c.innerHTML=`<div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px">${compounds.map((comp,i)=>`<button onclick="simNox.idx=${i};simNox.render()" style="padding:7px 12px;border-radius:var(--r3);font-weight:700;font-size:.78rem;cursor:pointer;border:1px solid ${i===idx?'var(--indigo)':'var(--border)'};min-height:36px;background:${i===idx?'var(--indigo)':'none'};color:${i===idx?'#fff':'var(--text)'}">${comp.f}</button>`).join('')}</div><div style="background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:18px;text-align:center"><h4 style="font-size:1.2rem;font-weight:800;margin-bottom:14px;color:var(--white)">${cp.f}</h4><div style="display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:12px">${cp.els.map(e=>`<div style="background:var(--card);border:1px solid var(--border);border-radius:var(--r2);padding:10px 14px;text-align:center;min-width:60px"><div style="font-size:1.2rem;font-weight:800;color:var(--white)">${e.s}</div><div style="font-size:.9rem;font-weight:700;margin-top:3px;color:${e.n>=0?'var(--blue)':'#ef4444'}">${e.n>0?'+':''}${e.n}</div><div style="font-size:.55rem;color:var(--text2);margin-top:1px">×${e.c}</div></div>`).join('')}</div><div style="font-size:.78rem;color:var(--text2)">Σ = <strong style="color:var(--teal)">${sum}</strong> ${sum===0?'✅':''}</div></div>`}window.simNox={idx,render(){idx=this.idx;render()}};render()};
function buildCustomSim(cfg,container){const state={};cfg.inputs.forEach(inp=>{state[inp.key]=inp.default||0});function calc(formula){try{const fn=new Function(...Object.keys(state),'return '+formula);const r=fn(...Object.values(state));return isFinite(r)?r:0}catch(e){return 0}}function render(){container.innerHTML=`<div class="sim-grid"><div class="sim-controls"><h4>⚙️ Parámetros</h4>${cfg.inputs.map(inp=>`<div class="control-group"><label>${inp.label}: <span>${state[inp.key]} ${inp.unit}</span></label><input type="range" min="${inp.min}" max="${inp.max}" step="${inp.step}" value="${state[inp.key]}" oninput="window._csim.set('${inp.key}',+this.value);this.parentNode.querySelector('span').textContent=this.value+' ${inp.unit}'"></div>`).join('')}</div><div><div class="results-grid" style="margin-top:0;margin-bottom:14px">${cfg.outputs.map(out=>{const val=calc(out.formula);return`<div class="result-box"><div class="rb-label">${out.label}</div><div class="rb-value" style="color:${out.color||'var(--teal)'}">${val.toFixed(out.decimals||3)} ${out.unit}</div></div>`}).join('')}</div>${cfg.info?`<div class="sim-info"><div>ℹ️</div><p>${cfg.info}</p></div>`:''}</div></div>`}window._csim={set(k,v){state[k]=v;render()}};render()}
function openSim(id){const sim=C.simulations.find(s=>s.id===id);const csim=(C.customSims||[]).find(s=>s.id===id);const target=sim||csim;if(!target)return;document.getElementById('sim-modal-content').innerHTML=`<div class="modal-header"><h2>${target.icon} ${target.title}</h2><button class="modal-close" onclick="closeModal('sim-modal')">✕</button></div>`;const bd=document.createElement('div');bd.className='modal-body';document.getElementById('sim-modal-content').appendChild(bd);if(simEngines[id])simEngines[id](bd);else if(csim)buildCustomSim(csim,bd);else bd.innerHTML='<p style="text-align:center;padding:40px;color:var(--text2)">En desarrollo...</p>';openModal('sim-modal')}
function renderVideos(){document.getElementById('videos-grid').innerHTML=C.videos.map((v,i)=>`<div class="video-card" data-vidx="${i}"><div class="video-thumb"><img src="https://img.youtube.com/vi/${v.youtubeId}/mqdefault.jpg" alt="${v.title}" loading="lazy"><div class="video-play"><div class="video-play-btn">▶</div></div><div class="video-dur">${v.duration}</div></div><div class="video-info"><span class="vi-tag">${v.category}</span><h3>${v.title}</h3><p>${v.description}</p></div></div>`).join('');document.querySelectorAll('.video-card').forEach(el=>{el.addEventListener('click',function(){const v=C.videos[+this.dataset.vidx];openVideo(v.youtubeId,v.title)})})}
function openVideo(id,title){document.getElementById('video-modal-content').innerHTML=`<div class="modal-header"><h2>${title}</h2><button class="modal-close" onclick="closeVideo()">✕</button></div><div class="modal-body"><div class="vm-iframe"><iframe src="https://www.youtube.com/embed/${id}?autoplay=1&playsinline=1" allow="autoplay;encrypted-media" allowfullscreen playsinline></iframe></div></div>`;openModal('video-modal')}
function closeVideo(){document.getElementById('video-modal-content').querySelector('iframe')?.remove();closeModal('video-modal')}
function renderPeriodicTable(){const g=document.getElementById('pt-grid'),cells=new Array(4*18).fill(null);C.elements.forEach(el=>{if(el.row<=4)cells[(el.row-1)*18+(el.col-1)]=el});g.innerHTML=cells.map(el=>{if(!el)return'<div class="pt-cell pt-empty"></div>';return`<div class="pt-cell pt-${el.cat}" onclick="showElement(${el.z})"><span class="pt-num">${el.z}</span><span class="pt-sym">${el.sym}</span></div>`}).join('');const shown={};C.elements.forEach(el=>shown[el.cat]=true);document.getElementById('pt-legend').innerHTML=Object.keys(shown).map(cat=>`<div class="pt-legend-item"><div class="pt-legend-color" style="background:${C.catColors[cat]}"></div>${C.catLabels[cat]}</div>`).join('')}
function showElement(z){const el=C.elements.find(e=>e.z===z);if(!el)return;const d=document.getElementById('el-detail');d.innerHTML=`<div class="el-big" style="background:${C.catColors[el.cat]}"><span class="eb-num">${el.z}</span><span class="eb-sym">${el.sym}</span></div><div class="el-info"><h3>${el.name}</h3><div class="el-props"><span class="el-prop">Masa:<strong>${el.mass} u</strong></span><span class="el-prop">Cat.:<strong>${C.catLabels[el.cat]}</strong></span></div>${el.config?`<div class="el-config">${el.config}</div>`:''}</div><button onclick="document.getElementById('el-detail').classList.remove('visible')" style="position:absolute;top:10px;right:10px;background:rgba(255,255,255,.06);border:1px solid var(--border);width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:.8rem;color:var(--text2);display:flex;align-items:center;justify-content:center">✕</button>`;d.classList.add('visible');d.scrollIntoView({behavior:'smooth',block:'nearest'})}
function renderFAQs(){document.getElementById('faq-list').innerHTML='<h3>Preguntas Frecuentes</h3>'+C.faqs.map(f=>`<div class="faq-item" id="faq-${f.id}"><button class="faq-q" onclick="document.getElementById('faq-${f.id}').classList.toggle('open')">${f.q}<span class="faq-chevron">▼</span></button><div class="faq-a"><div class="faq-a-inner">${f.a}</div></div></div>`).join('')}
function renderContactForm(){document.getElementById('contact-form-container').innerHTML=`<div class="contact-box"><div style="display:flex;align-items:center;gap:10px;margin-bottom:14px"><div style="width:36px;height:36px;background:var(--teal);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1rem">💬</div><div><h3>¿Dudas?</h3><p class="sub">Te responderemos.</p></div></div><form onsubmit="submitContact(event)"><div class="form-row form-row-2"><div class="form-group"><label>Nombre</label><input type="text" required placeholder="Tu nombre"></div><div class="form-group"><label>Email</label><input type="email" required placeholder="tu@email.com"></div></div><div class="form-row"><div class="form-group"><label>Mensaje</label><textarea rows="4" required placeholder="Tu consulta..."></textarea></div></div><button type="submit" class="form-submit">📤 Enviar</button></form></div>`}
function submitContact(e){e.preventDefault();document.getElementById('contact-form-container').innerHTML=`<div class="contact-box"><div class="form-success"><div class="fs-icon">✅</div><h3 style="color:var(--white)">¡Enviado!</h3><p style="color:var(--text2)">Te responderemos pronto.</p><button class="btn btn-primary" onclick="renderContactForm()" style="margin-top:8px">Enviar otro</button></div></div>`}
document.getElementById('feedback-fab').addEventListener('click',toggleFeedback);
function toggleFeedback(){const p=document.getElementById('feedback-panel');const open=p.classList.toggle('open');document.getElementById('feedback-fab').textContent=open?'✕':'💬'}
function setFeedbackType(btn){document.querySelectorAll('.feedback-type button').forEach(b=>b.classList.remove('active'));btn.classList.add('active')}
function submitFeedback(){const t=document.getElementById('feedback-text');if(!t||!t.value.trim())return;document.getElementById('feedback-body').innerHTML='<div style="text-align:center;padding:18px"><div style="font-size:2rem;margin-bottom:6px">✅</div><h3 style="font-weight:700;color:var(--white)">¡Gracias!</h3><p style="font-size:.78rem;color:var(--text2)">Comentario enviado.</p></div>';setTimeout(()=>{toggleFeedback();setTimeout(()=>{document.getElementById('feedback-body').innerHTML='<div class="feedback-type"><button type="button" class="active" data-type="error" onclick="setFeedbackType(this)">🐛 Error</button><button type="button" data-type="sugerencia" onclick="setFeedbackType(this)">💡 Sugerencia</button></div><textarea class="feedback-textarea" id="feedback-text" placeholder="Describe el error o tu sugerencia..."></textarea><button class="feedback-submit" onclick="submitFeedback()">Enviar</button>'},400)},2000)}
document.addEventListener('click',e=>{['topic-modal','lesson-modal','lab-modal','sim-modal','video-modal'].forEach(id=>{if(e.target.id===id){if(id==='video-modal')closeVideo();else closeModal(id)}})});
let touchStartY=0;document.addEventListener('touchstart',e=>{touchStartY=e.touches[0].clientY},{passive:true});document.addEventListener('touchend',e=>{if(e.changedTouches[0].clientY-touchStartY>120){const o=document.querySelector('.modal-overlay.open');if(o){if(o.id==='video-modal')closeVideo();else closeModal(o.id)}}},{passive:true});
const adminTabs=[{key:'site',label:'🏠 General'},{key:'hero',label:'🎯 Portada'},{key:'topics',label:'📚 Temas'},{key:'lessons',label:'📖 Lecciones'},{key:'quizzes',label:'📝 Quizzes'},{key:'labs',label:'🔬 Prácticas'},{key:'videos',label:'🎬 Videos'},{key:'faqs',label:'❓ Preguntas'},{key:'sections',label:'🏷️ Secciones'},{key:'nav',label:'🧭 Menú'},{key:'footer',label:'📄 Pie'},{key:'heroCards',label:'🃏 Cards'},{key:'heroCta',label:'🔘 Botones'},{key:'customSims',label:'🧮 Crear Sim'},{key:'password',label:'🔒 Clave'},{key:'raw',label:'🔧 Avanzado'}];
let activeTab=0,adminAuth=false;
document.addEventListener('keydown',e=>{if(e.ctrlKey&&e.shiftKey&&(e.key==='Q'||e.key==='q')){e.preventDefault();document.getElementById('admin-overlay').classList.contains('open')?closeAdmin():openAdmin()}});
function openAdmin(){if(!adminAuth){const p=prompt('🔒 Contraseña:');if(p!==C.admin.password){if(p!==null)toast('❌ Incorrecta');return}adminAuth=true}document.getElementById('admin-overlay').classList.add('open');document.body.style.overflow='hidden';drawAdmin()}
function closeAdmin(){document.getElementById('admin-overlay').classList.remove('open');document.body.style.overflow=''}
function toast(m){const d=document.createElement('div');d.className='atoast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2500)}
function drawAdmin(){document.getElementById('admin-tabs').innerHTML=adminTabs.map((t,i)=>`<button class="admin-tab${i===activeTab?' active':''}" onclick="activeTab=${i};drawAdmin()">${t.label}</button>`).join('');const b=document.getElementById('admin-body');const k=adminTabs[activeTab].key;const F=(l,id,v,t,ph)=>`<div class="ae"><label>${l}</label>${t==='textarea'?`<textarea id="${id}" rows="3" placeholder="${ph||''}">${v!=null?v:''}</textarea>`:`<input id="${id}" value="${(v!=null?v:'').toString().replace(/"/g,'&quot;')}" placeholder="${ph||''}">`}</div>`;const D=(fn)=>`<button class="adel" onclick="if(confirm('¿Eliminar?')){${fn}}">🗑️</button>`;const info=(text)=>`<div class="ainfo"><span>💡</span><span>${text}</span></div>`;
if(k==='site')b.innerHTML=info('<b>Datos generales</b> del sitio.')+`<div class="ae-row ae-2">${F('Nombre','as-name',C.site.name)}</div>`+F('Descripción','as-desc',C.site.description,'textarea')+`<div class="ae-row ae-2">${F('URL','as-url',C.site.url)}${F('Analytics','as-ga',C.site.analyticsId)}</div>`+F('Año','as-year',C.site.year);
else if(k==='hero')b.innerHTML=info('<b>Portada.</b> Stats se calculan solas.')+F('Badge','ah-badge',C.hero.badge)+F('Título','ah-title',C.hero.title,'textarea')+F('Subtítulo','ah-sub',C.hero.subtitle,'textarea');
else if(k==='topics')b.innerHTML=info('<b>Temas.</b> Los nombres de lecciones deben coincidir con "📖 Lecciones".')+C.topics.map((t,i)=>`<div class="acard"><div class="acard-head"><h4><span class="acard-num">${i+1}</span>${t.icon} ${t.title}</h4>${D(`C.topics.splice(${i},1);drawAdmin()`)}</div><div class="ae-row ae-icon"><div class="ae"><label>Emoji</label><input id="at-ic-${i}" value="${t.icon}" style="text-align:center;font-size:1.2rem"></div><div class="ae"><label>Título</label><input id="at-ti-${i}" value="${t.title}"></div></div>${F('Descripción','at-de-'+i,t.desc,'textarea')}<div class="ae-row ae-2">${F('Etiqueta','at-tg-'+i,t.tag)}${F('Color','at-co-'+i,t.color)}</div>${F('Lecciones (una por línea)','at-le-'+i,t.lessons.join('\n'),'textarea')}</div>`).join('')+`<button class="aadd" onclick="C.topics.push({title:'Nuevo',icon:'📘',desc:'',lessons:['Lección 1'],tag:'Nuevo',color:'var(--teal)'});drawAdmin()">+ Agregar tema</button>`;
else if(k==='raw')b.innerHTML=info('⚠️ <b>Avanzado.</b> JSON completo.')+`<div class="ae"><label>CONFIG</label><textarea id="admin-raw" style="min-height:400px;font-family:monospace;font-size:.72rem">${JSON.stringify(CONFIG,null,2)}</textarea></div>`;
else b.innerHTML=`<div class="ainfo"><span>💡</span><span>Pestaña <b>${adminTabs[activeTab].label}</b> — Usa "🔧 Avanzado" para editar esta sección como JSON.</span></div>`;
}
function applyAdminChanges(){try{const k=adminTabs[activeTab].key;if(k==='site'){C.site.name=document.getElementById('as-name').value;C.site.description=document.getElementById('as-desc').value;C.site.url=document.getElementById('as-url').value;C.site.analyticsId=document.getElementById('as-ga').value;C.site.year=document.getElementById('as-year').value}else if(k==='hero'){C.hero.badge=document.getElementById('ah-badge').value;C.hero.title=document.getElementById('ah-title').value;C.hero.subtitle=document.getElementById('ah-sub').value}else if(k==='topics'){C.topics.forEach((t,i)=>{const ic=document.getElementById('at-ic-'+i),ti=document.getElementById('at-ti-'+i),de=document.getElementById('at-de-'+i),tg=document.getElementById('at-tg-'+i),co=document.getElementById('at-co-'+i),le=document.getElementById('at-le-'+i);if(ic)t.icon=ic.value;if(ti)t.title=ti.value;if(de)t.desc=de.value;if(tg)t.tag=tg.value;if(co)t.color=co.value;if(le)t.lessons=le.value.split('\n').filter(x=>x.trim())})}else if(k==='raw'){const parsed=JSON.parse(document.getElementById('admin-raw').value);Object.keys(parsed).forEach(key=>{CONFIG[key]=parsed[key]})}buildApp();toast('✅ Cambios aplicados')}catch(err){alert('❌ Error: '+err.message)}}
function downloadConfig(){const c='const CONFIG = '+JSON.stringify(CONFIG,null,2)+';\n';const b=new Blob([c],{type:'application/javascript'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download='config.js';a.click();URL.revokeObjectURL(u)}
buildApp();

function enhanceLayout(){
const hero=document.querySelector('.hero');
if(hero){
const stats=hero.querySelector('.hero-stats');
if(stats){
const bar=document.createElement('div');
bar.className='hero-bar';
bar.innerHTML=`<div class="hero-bar-inner"><div class="hero-bar-stats">${C.hero.stats.map(s=>`<div class="hb-stat"><span class="hb-num">${s.text.split(' ')[0]}</span><span class="hb-label">${s.text.split(' ').slice(1).join(' ')}</span></div>`).join('')}</div><div class="hero-bar-credit"><span>Cátedra del</span><strong>Prof. Wilmer Molina</strong></div></div>`;
stats.replaceWith(bar);
}
}

const footer=document.querySelector('footer');
if(footer){
footer.innerHTML=`<div class="container"><div class="ft-top"><div class="ft-brand"><div class="logo"><div class="logo-icon">⚗️</div><span class="logo-text">${C.site.name}</span></div><p class="ft-desc">${C.footer.description}</p></div><div class="ft-cols">${C.footer.columns.map(col=>`<div class="ft-col"><h4>${col.title}</h4><ul>${col.links.map(l=>`<li><a href="#">${l}</a></li>`).join('')}</ul></div>`).join('')}</div></div><div class="ft-mid"><div class="ft-team"><div class="ft-person"><div class="ft-avatar">👨‍🏫</div><div><strong>Prof. Wilmer Molina</strong><span>Docente de Química General</span></div></div><div class="ft-person"><div class="ft-avatar">💻</div><div><strong>Jimmy Bracho</strong><span>Desarrollo Web</span></div></div></div></div><div class="ft-bottom"><p class="copy">© ${C.site.year} ${C.site.name} — Todos los derechos reservados</p><div class="socials">${C.footer.socials.map(s=>`<a href="${s.url}" class="social-link">${s.label}</a>`).join('')}</div></div></div>`;
}
}
enhanceLayout();
</script>
</body>
