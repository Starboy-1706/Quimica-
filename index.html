<div class="admin-body" id="admin-body"></div>
<div class="admin-actions">
<button onclick="applyAdminChanges()" style="background:var(--teal);color:#fff">✅ Aplicar Cambios</button>
<button onclick="downloadConfig()" style="background:var(--indigo);color:#fff">📥 Descargar config.js</button>
<button onclick="closeAdmin()" style="background:var(--slate-200);color:var(--slate-700)">Cerrar</button>
</div>
<div class="admin-hint">💡 <strong>Ctrl+Shift+Q</strong> abre/cierra este panel. Las estadísticas del hero se calculan solas. Descarga el config.js y reemplázalo en tu carpeta para guardar los cambios.</div>
</div></div>


<div class="modal-overlay" id="topic-modal"><div class="modal" id="topic-modal-content"></div></div>
<div class="modal-overlay" id="lesson-modal"><div class="modal" id="lesson-modal-content"></div></div>

<div class="modal-overlay" id="video-modal"><div class="modal" id="video-modal-content"></div></div>

<script src="config.js"></script>
<script>
const C=CONFIG;

function autoIds(){
C.topics.forEach((t,i)=>{t.id='t-'+i});
C.labs.forEach((l,i)=>{l.id='lab-'+i});
C.faqs.forEach((f,i)=>{f.id='faq-'+i});
}

function autoStats(){
let totalLessons=0;
C.topics.forEach(t=>{totalLessons+=t.lessons.length});
C.hero.stats=[
{icon:'📚',text:C.topics.length+' Temas'},
{icon:'🧪',text:C.simulations.length+' Sims'},
{icon:'🔬',text:C.labs.length+' Labs'},
{icon:'🎬',text:C.videos.length+' Videos'},
{icon:'📝',text:totalLessons+' Lecciones'}
];
}

function buildApp(){
autoIds();
autoStats();
const root=document.getElementById('app-root');
root.innerHTML=`
<nav class="navbar" id="navbar" role="navigation" aria-label="Navegación principal">
<div class="container navbar-inner">

</div></div>
<div class="mobile-menu" id="mobile-menu">${C.nav.map(n=>`<a href="${n.href}" onclick="closeMobile()"><span class="m-icon">${n.icon}</span> ${n.label}</a>`).join('')}</div>

<nav class="bottom-nav" id="bottom-nav">${C.nav.map(n=>`<a href="${n.href}" onclick="navTo(this)">${'<span class="bn-icon">'+n.icon+'</span>'+n.label.substring(0,6)}</a>`).join('')}</nav>

<header class="hero"><div class="container hero-grid"><div>
<div class="hero-badge"><div class="pulse"></div><span>${C.hero.badge}</span></div>
<h1>${C.hero.title}</h1>
<p class="hero-desc">${C.hero.subtitle}</p>
<div class="hero-actions">${C.hero.cta.map(b=>`<button class="btn btn-${b.style}" onclick="scrollToId('${b.target}')">${b.text}</button>`).join('')}</div>
<div class="hero-stats">${C.hero.stats.map(s=>`<div class="stat"><span>${s.icon}</span> ${s.text}</div>`).join('')}</div>
</div>
<div class="hero-cards">${C.hero.cards.map(c=>`<div class="hero-card"><div class="hc-icon">${c.icon}</div><div class="hc-title">${c.title}</div><div class="hc-desc">${c.desc}</div></div>`).join('')}</div>
</div>
<div class="hero-wave"><svg viewBox="0 0 1440 100" fill="none"><path d="M0 100V40C120 20 240 10 360 10C480 10 600 30 720 50C840 70 960 80 1080 80C1200 80 1320 60 1440 40V100H0Z" fill="white"/></svg></div>
</header>

${buildSection('topics','grid-3','topics-grid')}
${buildSection('simulations','grid-4','simulations-grid',true)}
${buildSection('labs','grid-3','labs-grid')}
${buildSection('periodic','','',true,'<div class="pt-scroll"><div class="pt-grid" id="pt-grid"></div></div><div class="pt-legend" id="pt-legend"></div><div class="el-detail" id="el-detail"></div>')}
${buildSection('videos','grid-4','videos-grid')}
<section id="faq-contact" class="container" style="padding-bottom:40px"><div style="display:grid;gap:32px"><div id="faq-list" class="faq-list"></div><div id="contact-form-container"></div></div></section>
</main>

<div class="footer-grid">

${C.footer.columns.map(col=>`<div><h4 class="footer-h">${col.title}</h4><ul class="footer-links">${col.links.map(l=>`<li><a href="#">${l}</a></li>`).join('')}</ul></div>`).join('')}
</div>

function buildSection(key,gridClass,gridId,hasBg,customContent){
const s=C.sections[key];if(!s)return '';
const bg=s.bg?` style="background:${s.bg}"`:'';

return `<section id="${key}"${bg}>${wrap?'<div class="container">':'<div class="container">'}<div class="section-header"><span class="section-tag" style="background:${s.tagColor};color:${s.tagText}">${s.tag}</span><h2 class="section-title">${s.title}</h2><p class="section-desc">${s.desc}</p></div>${inner}${wrap?'</div>':'</div>'}</section>`;

let quizState={};
function openLesson(title,topic,color){
const sections=C.lessonContent[title]||C.lessonContent['_default'];
const quiz=C.quizzes[title]||C.quizzes['_default'];
quizState={title,answered:{},score:0};
document.getElementById('lesson-modal-content').innerHTML=`
<div class="lesson-header" style="background:${color}"><button class="modal-close" onclick="closeModal('lesson-modal')" style="position:absolute;top:calc(16px + var(--safe-top));right:16px">✕</button><p>${topic}</p><h2>${title}</h2><div style="margin-top:10px;font-size:.72rem;opacity:.7">${sections.length} secciones + Quiz</div></div>
<div class="modal-body lesson-content">
${sections.map((s,i)=>`<div style="margin-bottom:${i<sections.length-1?'28px':'0'}"><div class="lesson-block-header"><span class="lesson-block-num">${i+1}</span><h2 style="margin:0">${s.t}</h2></div><p>${s.c}</p>${i<sections.length-1?'<div class="lesson-divider"></div>':''}</div>`).join('')}
<div class="quiz-section"><div class="quiz-title"><span>📝</span> Autoevaluación</div>
${quiz.map((q,qi)=>`<div class="quiz-question" data-qi="${qi}"><div class="quiz-question-text">${qi+1}. ${q.q}</div><div class="quiz-options">${q.opts.map((o,oi)=>`<div class="quiz-option" data-qi="${qi}" data-oi="${oi}" onclick="pickQuiz(this,${qi},${oi})" role="button" tabindex="0"><span class="opt-marker">${String.fromCharCode(65+oi)}</span><span>${o}</span></div>`).join('')}</div><div class="quiz-feedback" id="qf-${qi}"></div></div>`).join('')}
<div class="quiz-score" id="quiz-score" style="display:none"><div style="font-size:.75rem;text-transform:uppercase;opacity:.8">Tu puntuación</div><div class="quiz-score-value" id="qsv"></div><div class="quiz-score-text" id="qst"></div></div></div>
<button class="btn btn-primary" onclick="closeModal('lesson-modal')" style="width:100%;justify-content:center;margin-top:24px">✅ Lección completada</button></div>`;
openModal('lesson-modal');
}

function pickQuiz(el,qi,oi){
const quiz=C.quizzes[quizState.title]||C.quizzes['_default'];const q=quiz[qi];
if(quizState.answered[qi]!==undefined)return;quizState.answered[qi]=oi;
document.querySelectorAll(`.quiz-option[data-qi="${qi}"]`).forEach((o,i)=>{o.style.pointerEvents='none';if(i===q.correct)o.classList.add('correct');else if(i===oi)o.classList.add('incorrect')});
const fb=document.getElementById(`qf-${qi}`);
if(oi===q.correct){quizState.score++;fb.className='quiz-feedback show correct';fb.innerHTML='<strong>✓ ¡Correcto!</strong> '+q.exp}
else{fb.className='quiz-feedback show incorrect';fb.innerHTML='<strong>✗ Incorrecto.</strong> '+q.exp}
if(Object.keys(quizState.answered).length===quiz.length){
const s=quizState.score,pct=Math.round(s/quiz.length*100);
document.getElementById('quiz-score').style.display='block';
document.getElementById('qsv').textContent=s+'/'+quiz.length;
document.getElementById('qst').textContent=pct===100?'¡Excelente! Dominas este tema.':pct>=70?'¡Muy bien! Repasa los puntos que fallaste.':'Te recomendamos repasar la lección.';
document.getElementById('quiz-score').scrollIntoView({behavior:'smooth',block:'center'})}}

const simEngines={};
simEngines['sim-ph']=function(c){let val=7,sub='Agua pura';const list=[{v:1,s:'Ácido batería'},{v:2.5,s:'Jugo limón'},{v:3,s:'Vinagre'},{v:5.5,s:'Café'},{v:6.5,s:'Leche'},{v:7,s:'Agua destilada'},{v:7.4,s:'Sangre'},{v:8.5,s:'Bicarbonato'},{v:10.5,s:'Leche magnesia'},{v:12.5,s:'Blanqueador'}];function render(){let col='var(--teal)';if(val<6.5)col='#ef4444';if(val>7.5)col='var(--blue)';c.innerHTML=`<div class="sim-grid"><div class="sim-controls"><h4>⚙️ Sustancia</h4><div class="control-group"><label>pH: <span>${val}</span></label><input type="range" min="0" max="14" step="0.1" value="${val}" oninput="simPH.update(+this.value)"></div><div style="display:grid;gap:6px">${list.map(i=>`<button onclick="simPH.update(${i.v},'${i.s}')" style="padding:10px 12px;font-size:.78rem;border:1px solid var(--slate-200);border-radius:6px;text-align:left;cursor:pointer;min-height:42px;${sub===i.s?'background:var(--slate-200);font-weight:700':''}">${i.s} (${i.v})</button>`).join('')}</div></div><div><h4>🧪 pH</h4><div class="ph-display"><div class="ph-num" style="color:${col}">${val.toFixed(1)}</div><div class="ph-label">${val<7?'ÁCIDO':val>7?'BÁSICO':'NEUTRO'} — ${sub}</div><div class="ph-bar"><div class="ph-marker" style="left:${(val/14)*100}%"></div></div><div class="ph-labels"><span>0</span><span>7</span><span>14</span></div></div><div class="sim-info"><div>ℹ️</div><p><strong>pH = -log[H⁺]</strong></p></div></div></div>`}window.simPH={update:(v,s)=>{val=v;sub=s||'Desconocida';render()}};render()};
simEngines['sim-tit']=function(c){let Ca=.1,Va=50,Cb=.1,Vb=0;function render(){const Veq=(Ca*Va)/Cb,pH=Vb<Veq?(Vb===0?-Math.log10(Ca):-Math.log10((Ca*Va-Cb*Vb)/(Va+Vb))):Vb===Veq?7:(14+Math.log10((Cb*Vb-Ca*Va)/(Va+Vb)));const pts=[];for(let i=0;i<=Veq*2;i+=.5){const p=i<Veq?(i===0?-Math.log10(Ca):-Math.log10((Ca*Va-Cb*i)/(Va+i))):i===Veq?7:(14+Math.log10((Cb*i-Ca*Va)/(Va+i)));pts.push({x:i,y:p})}const pathD="M"+pts.map(p=>`${40+(p.x/(Veq*2))*340},${10+(1-p.y/14)*210}`).join(" L");c.innerHTML=`<div class="sim-grid"><div class="sim-controls"><h4>🧪 Titulación</h4><div class="control-group"><label>C ácido: <span>${Ca.toFixed(3)} M</span></label><input type="range" min=".01" max="1" step=".01" value="${Ca}" onchange="simTit.Ca=+this.value;simTit.render()" oninput="this.parentNode.querySelector('span').textContent=(+this.value).toFixed(3)+' M'"></div><div class="control-group"><label>V ácido: <span>${Va} mL</span></label><input type="range" min="10" max="100" step="5" value="${Va}" onchange="simTit.Va=+this.value;simTit.render()" oninput="this.parentNode.querySelector('span').textContent=this.value+' mL'"></div><div class="control-group"><label>C base: <span>${Cb.toFixed(3)} M</span></label><input type="range" min=".01" max="1" step=".01" value="${Cb}" onchange="simTit.Cb=+this.value;simTit.render()" oninput="this.parentNode.querySelector('span').textContent=(+this.value).toFixed(3)+' M'"></div><hr style="border:none;border-top:1px solid var(--slate-200);margin:10px 0"><div class="control-group"><label>V base: <span style="color:var(--purple)">${Vb.toFixed(1)} mL</span></label><input type="range" min="0" max="${Math.round(Veq*2)}" step=".5" value="${Vb}" onchange="simTit.Vb=+this.value;simTit.render()" oninput="this.parentNode.querySelector('span').textContent=(+this.value).toFixed(1)+' mL'"></div><div class="results-grid"><div class="result-box"><div class="rb-label">V equiv.</div><div class="rb-value" style="color:var(--purple)">${Veq.toFixed(1)} mL</div></div><div class="result-box"><div class="rb-label">pH</div><div class="rb-value" style="color:${pH<7?'#ef4444':'var(--blue)'}">${pH.toFixed(2)}</div></div></div></div><div><div class="curve-box"><h4>📈 Curva</h4><svg viewBox="0 0 400 240" style="width:100%"><rect x="40" y="10" width="340" height="210" fill="var(--slate-50)" stroke="var(--slate-200)" rx="4"/>${[0,2,4,6,7,8,10,12,14].map(p=>`<line x1="40" y1="${10+(1-p/14)*210}" x2="380" y2="${10+(1-p/14)*210}" stroke="${p===7?'var(--teal)':'var(--slate-200)'}" stroke-width="${p===7?1.5:.5}" ${p===7?'stroke-dasharray="4,4"':''}/><text x="36" y="${14+(1-p/14)*210}" text-anchor="end" style="font-size:9px;fill:var(--slate-400)">${p}</text>`).join('')}<path d="${pathD}" fill="none" stroke="var(--purple)" stroke-width="2.5"/><circle cx="${40+(Vb/(Veq*2))*340}" cy="${10+(1-pH/14)*210}" r="5" fill="#ef4444" stroke="white" stroke-width="2"/></svg></div><div class="sim-info"><div>ℹ️</div><p><strong>Ca×Va = Cb×Vb</strong></p></div></div></div>`}window.simTit={Ca,Va,Cb,Vb,render(){Ca=this.Ca;Va=this.Va;Cb=this.Cb;Vb=this.Vb;render()}};render()};
simEngines['sim-estequio']=function(c){let masa=10,mmR=18.02,mmP=44.01,cR=1,cP=1;function render(){const nR=masa/mmR,nP=nR*(cP/cR),mP=nP*mmP,part=nR*6.022e23;c.innerHTML=`<div class="sim-grid"><div class="sim-controls"><h4>⚙️ Reactivo</h4><div class="control-group"><label>Masa: <span>${masa.toFixed(1)} g</span></label><input type="range" min=".1" max="100" step=".1" value="${masa}" onchange="simEst.masa=+this.value;simEst.render()" oninput="this.parentNode.querySelector('span').textContent=(+this.value).toFixed(1)+' g'"></div><div class="control-group"><label>MM R: <span>${mmR.toFixed(2)}</span></label><input type="range" min="1" max="300" step=".01" value="${mmR}" onchange="simEst.mmR=+this.value;simEst.render()" oninput="this.parentNode.querySelector('span').textContent=(+this.value).toFixed(2)"></div><div class="control-group"><label>MM P: <span>${mmP.toFixed(2)}</span></label><input type="range" min="1" max="300" step=".01" value="${mmP}" onchange="simEst.mmP=+this.value;simEst.render()" oninput="this.parentNode.querySelector('span').textContent=(+this.value).toFixed(2)"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div><label style="font-size:.65rem;font-weight:700;color:var(--slate-500)">Coef R</label><input type="number" value="${cR}" min="1" style="width:100%;padding:10px;border:1px solid var(--slate-300);border-radius:var(--radius-xs);margin-top:4px;font-size:16px" onchange="simEst.cR=Math.max(1,+this.value);simEst.render()"></div><div><label style="font-size:.65rem;font-weight:700;color:var(--slate-500)">Coef P</label><input type="number" value="${cP}" min="1" style="width:100%;padding:10px;border:1px solid var(--slate-300);border-radius:var(--radius-xs);margin-top:4px;font-size:16px" onchange="simEst.cP=Math.max(1,+this.value);simEst.render()"></div></div></div><div><h4 style="font-weight:700;margin-bottom:12px">📊 Resultados</h4><div class="results-grid"><div class="result-box"><div class="rb-label">Moles R</div><div class="rb-value" style="color:var(--blue)">${nR.toFixed(4)}</div></div><div class="result-box"><div class="rb-label">Moles P</div><div class="rb-value" style="color:var(--teal)">${nP.toFixed(4)}</div></div><div class="result-box"><div class="rb-label">Masa P</div><div class="rb-value" style="color:var(--purple)">${mP.toFixed(2)} g</div></div><div class="result-box"><div class="rb-label">Partículas</div><div class="rb-value" style="color:var(--amber);font-size:.8rem">${part.toExponential(2)}</div></div></div><div class="sim-info" style="margin-top:12px"><div>ℹ️</div><p><strong>n=m/M | N=n×Nₐ</strong></p></div></div></div>`}window.simEst={masa,mmR,mmP,cR,cP,render(){masa=this.masa;mmR=this.mmR;mmP=this.mmP;cR=this.cR;cP=this.cP;render()}};render()};

simEngines['sim-coligativas']=function(c){let m=1,i=1,mol=.5,T=298.15;const Kb=.512,Kf=1.86,R=.0821;function render(){const dTb=Kb*m*i,dTf=Kf*m*i,pi=mol*R*T*i;c.innerHTML=`<div class="sim-grid"><div class="sim-controls"><h4>⚙️ Parámetros</h4><div class="control-group"><label>Molalidad: <span>${m.toFixed(2)}</span></label><input type="range" min=".01" max="5" step=".01" value="${m}" onchange="simCol.m=+this.value;simCol.render()" oninput="this.parentNode.querySelector('span').textContent=(+this.value).toFixed(2)"></div><div class="control-group"><label>Factor i: <span>${i}</span></label><input type="range" min="1" max="5" step="1" value="${i}" onchange="simCol.i=+this.value;simCol.render()" oninput="this.parentNode.querySelector('span').textContent=this.value"></div><div class="control-group"><label>Molaridad: <span>${mol.toFixed(2)} M</span></label><input type="range" min=".01" max="2" step=".01" value="${mol}" onchange="simCol.mol=+this.value;simCol.render()" oninput="this.parentNode.querySelector('span').textContent=(+this.value).toFixed(2)+' M'"></div><div class="control-group"><label>T: <span>${T.toFixed(0)} K</span></label><input type="range" min="273" max="373" step="1" value="${T}" onchange="simCol.T=+this.value;simCol.render()" oninput="this.parentNode.querySelector('span').textContent=this.value+' K'"></div></div><div><div class="results-grid"><div class="result-box"><div class="rb-label">ΔTb</div><div class="rb-value" style="color:#ef4444">+${dTb.toFixed(3)}°C</div></div><div class="result-box"><div class="rb-label">ΔTf</div><div class="rb-value" style="color:var(--blue)">-${dTf.toFixed(3)}°C</div></div><div class="result-box"><div class="rb-label">T ebu.</div><div class="rb-value" style="color:var(--amber)">${(100+dTb).toFixed(2)}°C</div></div><div class="result-box"><div class="rb-label">T cong.</div><div class="rb-value" style="color:var(--cyan)">${(0-dTf).toFixed(2)}°C</div></div></div><div class="big-result" style="background:var(--purple)"><div class="br-label">π osmótica</div><div class="br-value">${pi.toFixed(2)} atm</div></div></div></div>`}window.simCol={m,i,mol,T,render(){m=this.m;i=this.i;mol=this.mol;T=this.T;render()}};render()};
simEngines['sim-config']=function(c){let z=11;function getConfig(Z){const order=['1s','2s','2p','3s','3p','4s','3d','4p','5s','4d','5p','6s','4f','5d','6p','7s','5f','6d','7p'];const maxE={s:2,p:6,d:10,f:14};let rem=Z;const res=[];for(const orb of order){if(rem<=0)break;const t=orb[orb.length-1],mx=maxE[t],e=Math.min(rem,mx);const sup='⁰¹²³⁴⁵⁶⁷⁸⁹';res.push(orb+String(e).split('').map(c=>sup[+c]).join(''));rem-=e}return res.join(' ')}function render(){c.innerHTML=`<div class="sim-grid"><div class="sim-controls"><h4>⚙️ Elemento</h4><div class="control-group"><label>Z: <span>${z}</span></label><input type="range" min="1" max="36" step="1" value="${z}" onchange="simCfg.z=+this.value;simCfg.render()" oninput="this.parentNode.querySelector('span').textContent=this.value"></div><div style="text-align:center;background:#fff;padding:16px;border-radius:var(--radius-sm);border:1px solid var(--slate-200);margin-top:8px"><div style="font-size:2.5rem;font-weight:900;color:var(--slate-900)">${z}</div><div style="font-size:.75rem;color:var(--slate-400)">Z = número atómico</div></div></div><div><div style="background:rgba(249,115,22,.06);border:1px solid rgba(249,115,22,.15);padding:16px;border-radius:var(--radius-sm);margin-bottom:12px"><h4 style="font-size:.82rem;font-weight:700;color:#9a3412;margin-bottom:6px">Configuración</h4><p style="font-family:monospace;font-weight:700;color:#7c2d12;font-size:.95rem;word-break:break-all">${getConfig(z)}</p></div><div class="sim-info"><div>ℹ️</div><p><strong>Aufbau + Pauli + Hund</strong></p></div></div></div>`}window.simCfg={z,render(){z=this.z;render()}};render()};
simEngines['sim-nox']=function(c){const compounds=[{f:'H₂O',els:[{s:'H',n:1,c:2},{s:'O',n:-2,c:1}]},{f:'H₂SO₄',els:[{s:'H',n:1,c:2},{s:'S',n:6,c:1},{s:'O',n:-2,c:4}]},{f:'NaCl',els:[{s:'Na',n:1,c:1},{s:'Cl',n:-1,c:1}]},{f:'KMnO₄',els:[{s:'K',n:1,c:1},{s:'Mn',n:7,c:1},{s:'O',n:-2,c:4}]},{f:'Fe₂O₃',els:[{s:'Fe',n:3,c:2},{s:'O',n:-2,c:3}]}];let idx=0;function render(){const cp=compounds[idx],sum=cp.els.reduce((a,e)=>a+e.n*e.c,0);c.innerHTML=`<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px">${compounds.map((comp,i)=>`<button onclick="simNox.idx=${i};simNox.render()" style="padding:9px 14px;border-radius:var(--radius-sm);font-weight:700;font-size:.82rem;cursor:pointer;border:none;min-height:40px;${i===idx?'background:var(--indigo);color:#fff':'background:var(--slate-100);color:var(--slate-600)'}">${comp.f}</button>`).join('')}</div><div style="background:var(--slate-50);border:1px solid var(--slate-200);border-radius:var(--radius);padding:20px;text-align:center"><h4 style="font-size:1.3rem;font-weight:900;margin-bottom:16px">${cp.f}</h4><div style="display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:14px">${cp.els.map(e=>`<div style="background:#fff;border:1px solid var(--slate-200);border-radius:var(--radius-sm);padding:12px 16px;text-align:center;min-width:70px;box-shadow:var(--shadow)"><div style="font-size:1.3rem;font-weight:900">${e.s}</div><div style="font-size:1rem;font-weight:700;margin-top:4px;color:${e.n>=0?'var(--blue)':'#ef4444'}">${e.n>0?'+':''}${e.n}</div><div style="font-size:.6rem;color:var(--slate-400);margin-top:2px">×${e.c}</div></div>`).join('')}</div><div style="font-size:.8rem;color:var(--slate-500)">Σ = <strong style="color:var(--teal)">${sum}</strong> ${sum===0?'✅':''}</div></div>`}window.simNox={idx,render(){idx=this.idx;render()}};render()};

simEngines['sim-disol']=function(c){
let masa=4,vol=250,pm=40,feq=1,dens=1.02;
function render(){
const errs=[];
if(vol<=0)errs.push('El volumen no puede ser 0.');
if(pm<=0)errs.push('El peso molecular debe ser mayor a 0.');
if(feq<=0)errs.push('El factor de equivalencia debe ser mayor a 0.');
if(dens<=0)errs.push('La densidad debe ser mayor a 0.');
const volL=vol/1000;
const moles=pm>0?masa/pm:0;
const M=volL>0?moles/volL:0;
const pe=pm>0&&feq>0?pm/feq:0;
const neq=pe>0?masa/pe:0;
const N=volL>0?neq/volL:0;
const masaSol=(dens*vol)-masa;
const masaSolKg=masaSol/1000;
const m=masaSolKg>0?moles/masaSolKg:0;
const hasErr=errs.length>0;

const step=(title,formula,substitution,result,unit,color)=>`
<div style="background:#fff;border:1px solid var(--slate-200);border-radius:10px;padding:14px;margin-bottom:12px">
<h4 style="font-size:.88rem;font-weight:700;color:${color};margin-bottom:8px">${title}</h4>
<div style="background:var(--slate-50);padding:10px;border-radius:6px;margin-bottom:8px;font-family:monospace;font-size:.82rem;color:var(--slate-600)">${formula}</div>
<div style="font-size:.82rem;color:var(--slate-700);margin-bottom:6px"><strong>Sustituyendo:</strong> ${substitution}</div>
<div style="display:inline-block;padding:8px 16px;background:${color};color:#fff;border-radius:8px;font-weight:900;font-size:1.1rem">${hasErr?'—':result.toFixed(3)} ${unit}</div>
</div>`;

c.innerHTML=`<div class="sim-grid">
<div class="sim-controls">
<h4 style="display:flex;align-items:center;gap:8px">🧫 Datos de Entrada</h4>
<div class="control-group"><label>Masa del soluto (g): <span>${masa}</span></label><input type="range" min="0.1" max="100" step="0.1" value="${masa}" oninput="simDisol.masa=+this.value;this.parentNode.querySelector('span').textContent=this.value;simDisol.render()"></div>
<div class="control-group"><label>Volumen solución (mL): <span>${vol}</span></label><input type="range" min="0" max="2000" step="5" value="${vol}" oninput="simDisol.vol=+this.value;this.parentNode.querySelector('span').textContent=this.value;simDisol.render()"></div>
<div class="control-group"><label>Peso Molecular (g/mol): <span>${pm}</span></label><input type="range" min="1" max="500" step="0.1" value="${pm}" oninput="simDisol.pm=+this.value;this.parentNode.querySelector('span').textContent=this.value;simDisol.render()"></div>
<div class="control-group"><label>Factor equiv. (H⁺/OH⁻): <span>${feq}</span></label><input type="range" min="1" max="5" step="1" value="${feq}" oninput="simDisol.feq=+this.value;this.parentNode.querySelector('span').textContent=this.value;simDisol.render()"></div>
<div class="control-group"><label>Densidad (g/mL): <span>${dens}</span></label><input type="range" min="0.5" max="2" step="0.01" value="${dens}" oninput="simDisol.dens=+this.value;this.parentNode.querySelector('span').textContent=this.value;simDisol.render()"></div>
<div style="margin-top:12px;padding:10px;background:var(--slate-50);border-radius:8px">
<div style="font-size:.7rem;font-weight:700;color:var(--slate-400);text-transform:uppercase;margin-bottom:4px">Valores intermedios</div>
<div style="font-size:.8rem;color:var(--slate-600)">Moles = ${moles.toFixed(4)} mol</div>
<div style="font-size:.8rem;color:var(--slate-600)">PE = ${pe.toFixed(2)} g/eq</div>
<div style="font-size:.8rem;color:var(--slate-600)">Masa solvente = ${masaSol.toFixed(2)} g</div>
</div>
</div>
<div>
${hasErr?`<div style="background:#fef2f2;border:1px solid #fecaca;color:#991b1b;padding:14px;border-radius:10px;margin-bottom:16px;font-size:.85rem;font-weight:600">⚠️ ${errs.join(' ')}</div>`:''}

<div class="results-grid" style="margin-bottom:16px;margin-top:0">
<div class="result-box"><div class="rb-label">Molaridad (M)</div><div class="rb-value" style="color:var(--teal)">${hasErr?'—':M.toFixed(3)}</div></div>
<div class="result-box"><div class="rb-label">Normalidad (N)</div><div class="rb-value" style="color:var(--purple)">${hasErr?'—':N.toFixed(3)}</div></div>
</div>
<div class="result-box" style="margin-bottom:20px"><div class="rb-label">Molalidad (m)</div><div class="rb-value" style="color:var(--blue)">${hasErr?'—':m.toFixed(3)} mol/kg</div></div>

<h4 style="font-weight:800;font-size:.95rem;margin-bottom:12px;display:flex;align-items:center;gap:8px">📋 Procedimiento Paso a Paso</h4>

${step('Paso 1 — Molaridad (M)',
'M = moles / V(L) = (masa / PM) / V(L)',
`M = (${masa} / ${pm}) / ${volL.toFixed(4)} = ${moles.toFixed(4)} / ${volL.toFixed(4)}`,
M,'M','var(--teal)')}

${step('Paso 2 — Normalidad (N)',
'N = nº equiv. / V(L) = (masa / PE) / V(L), donde PE = PM / factor',
`PE = ${pm} / ${feq} = ${pe.toFixed(2)} → N = (${masa} / ${pe.toFixed(2)}) / ${volL.toFixed(4)} = ${neq.toFixed(4)} / ${volL.toFixed(4)}`,
N,'N','var(--purple)')}

${step('Paso 3 — Molalidad (m)',
'm = moles / kg solvente, donde masa solvente = (dens × vol) − masa soluto',
`Solvente = (${dens} × ${vol}) − ${masa} = ${masaSol.toFixed(2)} g = ${masaSolKg.toFixed(4)} kg → m = ${moles.toFixed(4)} / ${masaSolKg.toFixed(4)}`,
m,'mol/kg','var(--blue)')}

<div class="sim-info"><div>ℹ️</div><p>Resultados con 3 decimales de precisión. Basado en las fórmulas de la Práctica 5 de Química General.</p></div>
</div></div>`;
}
window.simDisol={masa,vol,pm,feq,dens,render(){masa=this.masa;vol=this.vol;pm=this.pm;feq=this.feq;dens=this.dens;render()}};render()};

simEngines['sim-valor']=function(c){
let mode=0;
let va=25,ca=0.1,vb=0,cb=0;
let vbLeche=1.5;
let vbDur=12,nbDur=0.01,vMuestra=100;

function inp(id,label,val,min,max,step,unit){
return `<div class="control-group"><label>${label}: <span>${val} ${unit}</span></label><input type="range" min="${min}" max="${max}" step="${step}" value="${val}" oninput="simValor.set('${id}',+this.value);this.parentNode.querySelector('span').textContent=this.value+' ${unit}'"></div>`;
}

function stepBox(title,formula,subs,result,unit,color){
return `<div style="background:#fff;border:1px solid var(--slate-200);border-radius:10px;padding:14px;margin-bottom:12px">
<h4 style="font-size:.88rem;font-weight:700;color:${color};margin-bottom:8px">${title}</h4>
<div style="background:var(--slate-50);padding:10px;border-radius:6px;margin-bottom:8px;font-family:monospace;font-size:.82rem;color:var(--slate-600)">${formula}</div>
<div style="font-size:.82rem;color:var(--slate-700);margin-bottom:6px"><strong>Sustituyendo:</strong> ${subs}</div>
<div style="display:inline-block;padding:8px 16px;background:${color};color:#fff;border-radius:8px;font-weight:900;font-size:1.1rem">${result} ${unit}</div></div>`;
}

function render(){
const tabs=['⚖️ Punto Equivalencia','🥛 Acidez Leche','💧 Dureza Agua'];
let content='';

if(mode===0){
if(vb>0&&cb>0){ca=(vb*cb)/va;} else if(va>0&&ca>0){vb=(va*ca)/cb||0;}
const veq=cb>0?(va*ca)/cb:0;
content=inp('va','Va (ácido)',va,1,100,0.5,'mL')+inp('ca','Ca (ácido)',ca,0.001,2,0.001,'M')+inp('cb','Cb (base)',cb,0.001,2,0.001,'M')+
`<div style="margin-top:16px">
${stepBox('Punto de Equivalencia','Va × Ca = Vb × Cb → Vb = (Va × Ca) / Cb',
`Vb = (${va} × ${ca.toFixed(3)}) / ${cb.toFixed(3)}`,
cb>0?veq.toFixed(3):'—','mL','var(--purple)')}
<div class="sim-info"><div>ℹ️</div><p>En el punto de equivalencia, los moles de ácido igualan los moles de base. El indicador cambia de color en este punto.</p></div></div>`;
}
else if(mode===1){
const dornic=vbLeche*10;
const tipo=dornic<15?'Leche fresca':dornic<=18?'Leche aceptable':'Leche ácida (no apta)';
const color=dornic<15?'var(--emerald)':dornic<=18?'var(--amber)':'var(--rose)';
content=inp('vbLeche','Vb NaOH gastado',vbLeche,0,5,0.1,'mL')+
`<div style="margin-top:16px">
${stepBox('Acidez de Leche (Grados Dornic)','°D = Vb × 10',
`°D = ${vbLeche} × 10`,dornic.toFixed(1),'°D',color)}
<div style="background:${color}22;border:1px solid ${color}44;padding:14px;border-radius:10px;margin-bottom:12px">
<div style="font-weight:700;color:${color};font-size:.9rem">${tipo}</div>
<div style="font-size:.78rem;color:var(--slate-600);margin-top:4px">Rango normal: 14-18 °D. Valores superiores indican acidificación por bacterias lácticas.</div></div>
<div class="sim-info"><div>ℹ️</div><p>La acidez Dornic mide el ácido láctico en leche. Se titula con NaOH 0.1N usando fenolftaleína como indicador.</p></div></div>`;
}
else if(mode===2){
const ppm=vMuestra>0?(vbDur*nbDur*50000)/vMuestra:0;
const tipo=ppm<75?'Agua blanda':ppm<=150?'Agua moderada':ppm<=300?'Agua dura':'Agua muy dura';
const color=ppm<75?'var(--teal)':ppm<=150?'var(--amber)':ppm<=300?'var(--orange)':'var(--rose)';
content=inp('vbDur','Vb EDTA gastado',vbDur,0,50,0.5,'mL')+inp('nbDur','Nb EDTA',nbDur,0.001,0.1,0.001,'N')+inp('vMuestra','V muestra agua',vMuestra,10,500,5,'mL')+
`<div style="margin-top:16px">
${stepBox('Dureza del Agua','ppm CaCO₃ = (Vb × Nb × 50000) / V muestra',
`ppm = (${vbDur} × ${nbDur} × 50000) / ${vMuestra}`,vMuestra>0?ppm.toFixed(3):'—','ppm',color)}
<div style="background:${color}22;border:1px solid ${color}44;padding:14px;border-radius:10px;margin-bottom:12px">
<div style="font-weight:700;color:${color};font-size:.9rem">${tipo} (${ppm.toFixed(1)} ppm)</div>
<div style="font-size:.78rem;color:var(--slate-600);margin-top:4px">Clasificación: Blanda &lt;75 · Moderada 75-150 · Dura 150-300 · Muy dura &gt;300 ppm</div></div>
<div class="sim-info"><div>ℹ️</div><p>La dureza mide la concentración de Ca²⁺ y Mg²⁺ disueltos. Se determina por titulación con EDTA usando Negro de Eriocromo T.</p></div></div>`;
}

c.innerHTML=`<div style="display:flex;gap:4px;margin-bottom:16px;overflow-x:auto;scrollbar-width:none">${tabs.map((t,i)=>`<button onclick="simValor.mode=${i};simValor.render()" style="padding:10px 14px;border-radius:var(--radius-xs);font-weight:700;font-size:.8rem;cursor:pointer;border:none;white-space:nowrap;min-height:44px;${i===mode?'background:var(--rose);color:#fff':'background:var(--slate-100);color:var(--slate-600)'}">${t}</button>`).join('')}</div>${content}`;
}
window.simValor={mode,va,ca,vb,cb,vbLeche,vbDur,nbDur,vMuestra,set(k,v){this[k]=v;this.render()},render(){mode=this.mode;va=this.va;ca=this.ca;vb=this.vb;cb=this.cb;vbLeche=this.vbLeche;vbDur=this.vbDur;nbDur=this.nbDur;vMuestra=this.vMuestra;render()}};render()};

simEngines['sim-glosario']=function(c){
const terms=[
{term:'Ácido (Arrhenius)',def:'Sustancia que en solución acuosa libera iones H⁺ (protones). Ejemplo: HCl → H⁺ + Cl⁻.',cat:'Conceptos'},
{term:'Base (Arrhenius)',def:'Sustancia que en solución acuosa libera iones OH⁻ (hidróxido). Ejemplo: NaOH → Na⁺ + OH⁻.',cat:'Conceptos'},
{term:'Ácido (Brønsted-Lowry)',def:'Especie que dona un protón (H⁺) a otra especie. Es una definición más amplia que la de Arrhenius.',cat:'Conceptos'},
{term:'Base (Brønsted-Lowry)',def:'Especie que acepta un protón (H⁺) de otra especie.',cat:'Conceptos'},
{term:'pH',def:'Medida de la acidez o basicidad de una solución. pH = −log[H⁺]. Escala de 0 (muy ácido) a 14 (muy básico). pH 7 = neutro.',cat:'Medición'},
{term:'pOH',def:'Medida complementaria al pH. pOH = −log[OH⁻]. Relación: pH + pOH = 14 a 25°C.',cat:'Medición'},
{term:'Valoración (Titulación)',def:'Técnica analítica que determina la concentración de un analito haciendo reaccionar un volumen conocido con un reactivo de concentración conocida (titulante).',cat:'Técnicas'},
{term:'Punto de Equivalencia',def:'Momento en la titulación donde los moles de ácido igualan exactamente los moles de base. Va × Ca = Vb × Cb.',cat:'Técnicas'},
{term:'Indicador',def:'Sustancia que cambia de color según el pH del medio. Fenolftaleína: incolora en ácido, rosa en base. Naranja de metilo: rojo en ácido, amarillo en base.',cat:'Técnicas'},
{term:'Molaridad (M)',def:'Concentración expresada como moles de soluto por litro de solución. M = n/V(L).',cat:'Concentración'},
{term:'Normalidad (N)',def:'Concentración expresada como número de equivalentes por litro de solución. N = M × factor de equivalencia.',cat:'Concentración'},
{term:'Molalidad (m)',def:'Concentración expresada como moles de soluto por kilogramo de solvente puro. m = n/kg solvente.',cat:'Concentración'},
{term:'Peso Equivalente (PE)',def:'Masa molecular dividida entre el número de H⁺ o OH⁻ que la sustancia puede intercambiar. PE = PM / factor.',cat:'Concentración'},
{term:'Grados Dornic (°D)',def:'Unidad de medida de la acidez de la leche. °D = Vb(NaOH) × 10. Leche fresca: 14-18 °D.',cat:'Aplicaciones'},
{term:'Dureza del Agua',def:'Concentración de iones Ca²⁺ y Mg²⁺ expresada en ppm de CaCO₃. Se determina por titulación con EDTA.',cat:'Aplicaciones'},
{term:'EDTA',def:'Ácido etilendiaminotetraacético. Agente quelante que forma complejos estables con cationes metálicos divalentes. Se usa para medir dureza del agua.',cat:'Reactivos'},
{term:'Fenolftaleína',def:'Indicador ácido-base. Incolora a pH < 8.2, rosa/magenta a pH > 10. Se usa en titulaciones con bases fuertes.',cat:'Reactivos'},
{term:'Negro de Eriocromo T',def:'Indicador metalocrómico. Vira de rojo vino (con Ca²⁺/Mg²⁺) a azul (libre) en presencia de EDTA. Se usa para determinar dureza del agua.',cat:'Reactivos'}
];

let filter='Todos';
const cats=['Todos',...[...new Set(terms.map(t=>t.cat))]];

function render(){
const filtered=filter==='Todos'?terms:terms.filter(t=>t.cat===filter);
c.innerHTML=`
<div style="display:flex;gap:6px;margin-bottom:20px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px">${cats.map(cat=>`<button onclick="simGlos.filter='${cat}';simGlos.render()" style="padding:8px 14px;border-radius:var(--radius-xs);font-weight:600;font-size:.78rem;cursor:pointer;border:none;white-space:nowrap;min-height:38px;${filter===cat?'background:var(--slate-800);color:#fff':'background:var(--slate-100);color:var(--slate-600)'}">${cat}</button>`).join('')}</div>
<div style="display:grid;gap:10px">${filtered.map(t=>`
<div style="background:#fff;border:1px solid var(--slate-200);border-radius:10px;padding:14px">
<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
<h4 style="font-size:.9rem;font-weight:800;color:var(--slate-900);margin-bottom:4px">${t.term}</h4>

<div style="border:1px solid var(--slate-200);border-radius:12px;padding:16px;margin-bottom:12px;background:#fff">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
<span style="font-weight:700;font-size:.85rem">Pregunta ${i+1}</span>
${delBtn(`C.faqs.splice(${i},1);drawAdmin()`)}
</div>
<input id="afq-q-${i}" value="${f.q}" style="width:100%;padding:8px;border:1px solid var(--slate-200);border-radius:6px;margin-bottom:8px" placeholder="Pregunta">
<textarea id="afq-a-${i}" rows="2" style="width:100%;padding:8px;border:1px solid var(--slate-200);border-radius:6px;font-size:.85rem" placeholder="Respuesta">${f.a}</textarea>
</div>`).join('')+
`<button onclick="C.faqs.push({id:C.faqs.length+1,q:'Nueva pregunta',a:'Respuesta'});drawAdmin()" style="padding:12px;background:var(--amber);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:700;width:100%">+ Agregar FAQ</button>`;
}
else if(k==='nav'){
b.innerHTML=C.nav.map((n,i)=>`
<div style="display:flex;gap:8px;margin-bottom:8px;align-items:center">
<input id="an-ic-${i}" value="${n.icon}" style="width:50px;padding:8px;border:1px solid var(--slate-200);border-radius:6px;text-align:center" placeholder="Emoji">
<input id="an-la-${i}" value="${n.label}" style="flex:1;padding:8px;border:1px solid var(--slate-200);border-radius:6px" placeholder="Label">
<input id="an-hr-${i}" value="${n.href}" style="width:120px;padding:8px;border:1px solid var(--slate-200);border-radius:6px" placeholder="#section">
${delBtn(`C.nav.splice(${i},1);drawAdmin()`)}
</div>`).join('')+
`<button onclick="C.nav.push({label:'Nuevo',href:'#',icon:'📌'});drawAdmin()" style="padding:10px;background:var(--slate-100);border:1px dashed var(--slate-300);border-radius:6px;cursor:pointer;font-size:.8rem;font-weight:600;width:100%;margin-top:8px">+ Agregar enlace</button>`;
}
else if(k==='footer'){
b.innerHTML=R('Descripción del footer','afo-desc',C.footer.description,'textarea')+
'<h4 style="font-weight:700;margin:20px 0 10px;font-size:.85rem">Columnas</h4>'+
C.footer.columns.map((col,i)=>`
<div style="border:1px solid var(--slate-200);border-radius:10px;padding:14px;margin-bottom:12px;background:#fff">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
<input id="afc-t-${i}" value="${col.title}" style="padding:8px;border:1px solid var(--slate-200);border-radius:6px;font-weight:700" placeholder="Título columna">
${delBtn(`C.footer.columns.splice(${i},1);drawAdmin()`)}
</div>
<label style="font-size:.65rem;font-weight:700;color:var(--slate-400);text-transform:uppercase">Links (uno por línea)</label>
<textarea id="afc-l-${i}" rows="4" style="width:100%;padding:8px;border:1px solid var(--slate-200);border-radius:6px;font-size:.85rem;margin-top:4px">${col.links.join('\n')}</textarea>
</div>`).join('')+
`<button onclick="C.footer.columns.push({title:'Nueva',links:['Link 1']});drawAdmin()" style="padding:10px;background:var(--slate-100);border:1px dashed var(--slate-300);border-radius:6px;cursor:pointer;font-size:.8rem;font-weight:600;width:100%">+ Agregar Columna</button>`;
}
else if(k==='raw'){
b.innerHTML=`<div class="admin-field"><label>Configuración completa (JSON)</label><textarea id="admin-raw" style="min-height:500px;font-size:.78rem;font-family:monospace">${JSON.stringify(CONFIG,null,2)}</textarea></div>
<p style="font-size:.72rem;color:var(--slate-400);margin-top:8px">⚠️ Editar con cuidado. Un error de sintaxis impedirá aplicar los cambios.</p>`;
}
}

function applyAdminChanges(){
try{
const k=adminTabs[activeTab].key;
if(k==='site'){C.site.name=document.getElementById('as-name').value;C.site.tagline=document.getElementById('as-tag').value;C.site.description=document.getElementById('as-desc').value;C.site.url=document.getElementById('as-url').value;C.site.analyticsId=document.getElementById('as-ga').value;C.site.year=document.getElementById('as-year').value}
else if(k==='hero'){C.hero.badge=document.getElementById('ah-badge').value;C.hero.title=document.getElementById('ah-title').value;C.hero.subtitle=document.getElementById('ah-sub').value}
else if(k==='topics'){C.topics.forEach((t,i)=>{const ic=document.getElementById('at-ic-'+i),ti=document.getElementById('at-ti-'+i),de=document.getElementById('at-de-'+i),tg=document.getElementById('at-tg-'+i),co=document.getElementById('at-co-'+i),le=document.getElementById('at-le-'+i);if(ic)t.icon=ic.value;if(ti)t.title=ti.value;if(de)t.desc=de.value;if(tg)t.tag=tg.value;if(co)t.color=co.value;if(le)t.lessons=le.value.split('\n').filter(x=>x.trim())})}
else if(k==='videos'){C.videos.forEach((v,i)=>{const ti=document.getElementById('av-ti-'+i),yt=document.getElementById('av-yt-'+i),du=document.getElementById('av-du-'+i),ca=document.getElementById('av-ca-'+i),de=document.getElementById('av-de-'+i);if(ti)v.title=ti.value;if(yt)v.youtubeId=yt.value;if(du)v.duration=du.value;if(ca)v.category=ca.value;if(de)v.description=de.value})}
else if(k==='faqs'){C.faqs.forEach((f,i)=>{const q=document.getElementById('afq-q-'+i),a=document.getElementById('afq-a-'+i);if(q)f.q=q.value;if(a)f.a=a.value})}
else if(k==='lessons'){document.querySelectorAll('[data-lk]').forEach(el=>{const key=el.dataset.lk,idx=+el.dataset.li,f=el.dataset.f;if(C.lessonContent[key]&&C.lessonContent[key][idx])C.lessonContent[key][idx][f]=el.value})}
else if(k==='quizzes'){document.querySelectorAll('[data-qk]').forEach(el=>{const key=el.dataset.qk,idx=+el.dataset.qi,f=el.dataset.f;if(C.quizzes[key]&&C.quizzes[key][idx]){if(f==='opts')C.quizzes[key][idx][f]=el.value.split('\n').filter(x=>x.trim());else if(f==='correct')C.quizzes[key][idx][f]=+el.value;else C.quizzes[key][idx][f]=el.value}})}
else if(k==='labs'){C.labs.forEach((l,i)=>{const ic=document.getElementById('al-ic-'+i),ti=document.getElementById('al-ti-'+i),de=document.getElementById('al-de-'+i),tg=document.getElementById('al-tg-'+i),co=document.getElementById('al-co-'+i);if(ic)l.icon=ic.value;if(ti)l.title=ti.value;if(de)l.desc=de.value;if(tg)l.tag=tg.value;if(co)l.color=co.value})}
else if(k==='nav'){C.nav.forEach((n,i)=>{const ic=document.getElementById('an-ic-'+i),la=document.getElementById('an-la-'+i),hr=document.getElementById('an-hr-'+i);if(ic)n.icon=ic.value;if(la)n.label=la.value;if(hr)n.href=hr.value})}
else if(k==='footer'){C.footer.description=document.getElementById('afo-desc').value;C.footer.columns.forEach((col,i)=>{const t=document.getElementById('afc-t-'+i),l=document.getElementById('afc-l-'+i);if(t)col.title=t.value;if(l)col.links=l.value.split('\n').filter(x=>x.trim())})}
else if(k==='raw'){const parsed=JSON.parse(document.getElementById('admin-raw').value);Object.keys(parsed).forEach(key=>{CONFIG[key]=parsed[key]})}
buildApp();
toast('✅ Cambios aplicados — estadísticas actualizadas');
}catch(err){alert('❌ Error: '+err.message)}
}

function downloadConfig(){
const c='const CONFIG = '+JSON.stringify(CONFIG,null,2)+';\n';
const b=new Blob([c],{type:'application/javascript'});
const u=URL.createObjectURL(b);
const a=document.createElement('a');a.href=u;a.download='config.js';a.click();URL.revokeObjectURL(u);
}

buildApp();

if('IntersectionObserver' in window){
const obs=new IntersectionObserver(entries=>{entries.forEach(entry=>{if(entry.isIntersecting){const id=entry.target.id;document.querySelectorAll('.bottom-nav a').forEach(a=>{a.classList.toggle('active',a.getAttribute('href')==='#'+id)})}})},{threshold:.3,rootMargin:'-20% 0px -60% 0px'});
['topics','simulations','labs','videos','periodic'].forEach(id=>{const el=document.getElementById(id);if(el)obs.observe(el)});
}
</script>
</body>
</html>
